<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政工作雙軌同步管理系統</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Noto Sans TC', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="app" class="flex flex-col md:flex-row min-h-screen">
    
    <!-- 左側導航欄 -->
    <aside class="w-full md:w-64 bg-slate-900 text-slate-200 flex flex-col justify-between shrink-0 shadow-xl">
      <div>
        <div class="p-6 border-b border-slate-800">
          <h1 class="text-xl font-bold text-white flex items-center gap-2"><span>🏫</span> 行政工作管理</h1>
        </div>
        <nav class="p-4 space-y-1.5">
          <button v-for="cat in categories" :key="cat.id" @click="currentCategory = cat.id"
            :class="['w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-sm transition', currentCategory === cat.id ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800']">
            <span>{{ cat.icon }} {{ cat.name }}</span>
          </button>
        </nav>
      </div>
      <div class="p-4 border-t border-slate-800 text-xs bg-slate-950/40">
        <button @click="fetchCloudData" class="w-full bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg border border-slate-700">🔄 手動同步雲端</button>
      </div>
    </aside>

    <!-- 右側主工作區 -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-8">
      <!-- 新增案件表單 -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h3 class="text-base font-bold mb-5">📝 新增案件</h3>
        <div class="grid grid-cols-2 gap-5 mb-5">
          <input v-model="form.date" type="date" class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm">
          <select v-model="form.lightColor" class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm">
            <option value="green">🟢 綠燈 (已完成)</option>
            <option value="yellow">🟡 黃燈 (辦理中)</option>
            <option value="red">🔴 紅燈 (待核定)</option>
          </select>
        </div>

        <div class="mb-5 pt-2 border-t border-slate-100">
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold">事件主旨與說明草稿</label>
            <!-- 實裝純 JS 的本地潤飾功能 -->
            <button type="button" @click="localAiRefine" class="text-xs text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg border border-indigo-200">✨ 免 API 一鍵說明語氣潤飾</button>
          </div>
          <textarea v-model="form.subject" rows="3" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm"></textarea>
        </div>

        <!-- 補上 File Input 的 HTML 結構 -->
        <div class="mb-6 p-4 rounded-xl border border-dashed border-slate-300 bg-slate-50">
          <label class="block text-xs font-bold mb-2">附加檔案 (支援照片 JPG/PNG、PDF)</label>
          <input type="file" ref="fileInput" @change="handleFileSelect" accept=".pdf, image/png, image/jpeg" class="text-xs text-slate-500">
          <span v-if="form.file" class="ml-2 text-xs text-blue-600">已選擇: {{ form.file.name }}</span>
        </div>

        <div class="flex justify-end">
          <button @click="handleSubmitRecord" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-xl">💾 儲存案件</button>
        </div>
      </section>

      <!-- 案件看板 -->
      <section class="space-y-6">
        <div class="bg-white rounded-2xl border-2 border-amber-200 shadow-sm overflow-hidden">
          <div class="bg-amber-50 px-6 py-3.5 border-b border-amber-200"><h4 class="font-bold text-amber-900">🟡 辦理中</h4></div>
          <div class="p-6 divide-y divide-slate-100">
            <!-- 綁定 update-record 事件 -->
            <record-item v-for="item in currentCategoryRecords.yellow" :key="item.id" :record="item"
              @update-record="updateRecord" @delete="deleteRecord(item.id)"></record-item>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    // 子元件：案件卡片
    const RecordItem = {
      props: ['record'],
      emits: ['update-record', 'delete'],
      template: `
        <div class="py-4 flex flex-col gap-2">
          <div class="flex justify-between items-center">
            <span class="text-xs bg-slate-100 px-2.5 py-1 rounded-lg">{{ record.date }}</span>
            <div class="flex gap-2 items-center">
              <select v-model="localLightColor" @change="emitUpdate" class="text-xs border rounded-xl px-2 py-1">
                <option value="yellow">🟡</option><option value="green">🟢</option><option value="red">🔴</option>
              </select>
              <button @click="$emit('delete')" class="text-xs text-rose-500 hover:bg-rose-50 p-1 rounded">🗑️</button>
            </div>
          </div>
          <p class="text-sm font-bold">{{ record.subject }}</p>
        </div>
      `,
      setup(props, { emit }) {
        const localLightColor = ref(props.record.lightColor);
        
        // 遵守單向資料流，打包新物件發送給父元件
        const emitUpdate = () => {
          const updatedRecord = { ...props.record, lightColor: localLightColor.value };
          emit('update-record', updatedRecord);
        };
        return { localLightColor, emitUpdate };
      }
    };

    // 父元件主程式
    createApp({
      components: { RecordItem },
      setup() {
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxSVJg9wRZryvZNjULjDrA5azW4Y8pXJ3hfTHsHwGJeeqaHgNO--domMpPZNo17GTQ_/exec';
        
        const categories = [{ id: 'official', name: '公文法規', icon: '📜' }];
        const currentCategory = ref('official');
        const records = ref([]);
        const fileInput = ref(null);

        const form = ref({ date: new Date().toISOString().split('T')[0], lightColor: 'yellow', subject: '', file: null });

        // 修復：實作純 JS 的本地潤飾邏輯
        const localAiRefine = () => {
          if (!form.value.subject) return alert('請先輸入草稿！');
          let text = form.value.subject;
          const rules = [
            { req: /今天開會討論畢旅，大家覺得要再問一下/g, rep: '本案經會議討論後，與會人員建議進一步確認相關事項，後續將持續辦理並追蹤。' },
            { req: /我想說|我覺得|想要/g, rep: '擬' },
            { req: /去做|去弄|處理一下/g, rep: '辦理' }
          ];
          rules.forEach(rule => text = text.replace(rule.req, rule.rep));
          form.value.subject = text;
        };

        const handleFileSelect = (e) => { if(e.target.files[0]) form.value.file = e.target.files[0]; };

        const saveLocalAndCloud = () => {
           // 這裡應實作將 records.value 存入 LocalStorage 與發送 fetch 至 GAS
           console.log('同步資料至雲端...', records.value);
        };

        const handleSubmitRecord = () => {
          if (!form.value.subject.trim()) return alert('請填寫主旨！');
          const newRecord = { 
            id: 'REC_' + Date.now(), 
            category: currentCategory.value, 
            date: form.value.date, 
            lightColor: form.value.lightColor, 
            subject: form.value.subject 
          };
          records.value.unshift(newRecord);
          form.value.subject = ''; form.value.file = null;
          if(fileInput.value) fileInput.value.value = '';
          saveLocalAndCloud();
        };

        // 修復：接收子元件的 updatedRecord 並更新陣列
        const updateRecord = (updatedRecord) => {
          const index = records.value.findIndex(r => r.id === updatedRecord.id);
          if (index !== -1) {
            records.value[index] = updatedRecord;
            saveLocalAndCloud();
          }
        };

        const deleteRecord = (id) => { 
          records.value = records.value.filter(r => r.id !== id); 
          saveLocalAndCloud();
        };
        
        const fetchCloudData = () => { /* 實作 GAS 資料拉取 */ };

        const currentCategoryRecords = computed(() => {
          const list = records.value.filter(r => r.category === currentCategory.value);
          return { yellow: list.filter(r => r.lightColor === 'yellow') };
        });

        // 🚨 核心修復：完整 Return 所有變數與函式，確保畫面綁定不會失效
        return {
          categories, currentCategory, records, form, fileInput,
          localAiRefine, handleFileSelect, handleSubmitRecord,
          updateRecord, deleteRecord, fetchCloudData, saveLocalAndCloud,
          currentCategoryRecords
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
