<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政工作管理與出題分配系統</title>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="app" class="flex flex-col md:flex-row min-h-screen">
    
    <!-- 左側導覽列 -->
    <aside class="w-full md:w-72 bg-slate-900 text-slate-200 flex flex-col justify-between shrink-0 shadow-xl overflow-y-auto">
      <div>
        <div class="p-5 border-b border-slate-800">
          <h1 class="text-lg font-bold text-white flex items-center gap-2">
            <span>🏫</span> 行政工作管理系統
          </h1>
          <p class="text-xs text-slate-400 mt-1">本機快取 ＋ 雲端同步</p>
        </div>

        <div class="p-3 space-y-1">
          <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider px-3 mb-1">主功能區</div>
          
          <button @click="activeView = 'records'" :class="['w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer', activeView === 'records' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800']">
            <span class="flex items-center gap-2"><span>📂</span> 業務案件看板</span>
            <span class="bg-blue-500/50 px-2 py-0.5 rounded-full text-[10px]">{{ records.length }}</span>
          </button>

          <button @click="activeView = 'exam'" :class="['w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer', activeView === 'exam' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800']">
            <span class="flex items-center gap-2"><span>📐</span> 定期評量出題</span>
            <span class="bg-amber-500/50 px-2 py-0.5 rounded-full text-[10px]">{{ examSchedules.length }} 年</span>
          </button>

          <button @click="activeView = 'crossExam'" :class="['w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer', activeView === 'crossExam' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800']">
            <span class="flex items-center gap-2"><span>📚</span> 學年工作出題記錄</span>
            <span class="bg-purple-500/50 px-2 py-0.5 rounded-full text-[10px]">高年級</span>
          </button>

          <button @click="activeView = 'rotation'" :class="['w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer', activeView === 'rotation' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800']">
            <span class="flex items-center gap-2"><span>🔄</span> 工作輪流順序登記</span>
            <span class="bg-indigo-500/50 px-2 py-0.5 rounded-full text-[10px]">{{ rotationDuties.length }} 項</span>
          </button>
        </div>

        <nav v-if="activeView === 'records'" class="px-3 pb-3 space-y-1 border-t border-slate-800 pt-3 mt-2">
          <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider px-3 my-1">業務分類模組</div>
          <button v-for="cat in categories" :key="cat.id" @click="currentCategory = cat.id" :class="['w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium transition cursor-pointer', currentCategory === cat.id ? 'bg-slate-800 text-blue-400 font-bold border-l-4 border-blue-500' : 'text-slate-400 hover:bg-slate-800 hover:text-white']">
            <div class="flex items-center gap-2"><span>{{ cat.icon }}</span><span>{{ cat.name }}</span></div>
            <span class="text-[10px] px-2 py-0.5 rounded-full" :class="currentCategory === cat.id ? 'bg-blue-500 text-white' : 'bg-slate-800 text-slate-400'">{{ countByCategory(cat.id) }}</span>
          </button>
        </nav>
      </div>

      <div class="p-4 border-t border-slate-800 text-xs bg-slate-950/40">
        <div class="flex items-center justify-between mb-2">
          <span class="text-slate-400">同步狀態</span>
          <span class="inline-flex items-center gap-1.5 font-medium" :class="{'text-emerald-400': syncStatus === 'synced', 'text-amber-400': syncStatus === 'syncing', 'text-rose-400': syncStatus === 'error'}">
            {{ syncStatusText }}
          </span>
        </div>
        <button @click="fetchCloudData" :disabled="syncStatus === 'syncing'" class="w-full mt-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 border border-slate-700 disabled:opacity-50 cursor-pointer">
          <span>🔄</span> 手動同步雲端
        </button>
      </div>
    </aside>

    <!-- 右側主工作區 -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-8 overflow-y-auto">
      
      <!-- 業務案件看板 -->
      <template v-if="activeView === 'records'">
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl font-bold">{{ activeCategory.icon }}</div>
            <div>
              <h2 class="text-2xl font-bold text-slate-800">{{ activeCategory.name }}</h2>
              <p class="text-xs text-slate-500 mt-0.5">案件內容、承辦與負責人員可自創與修訂</p>
            </div>
          </div>
        </header>

        <!-- 新增案件表單 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-5">
          <h3 class="text-base font-bold text-slate-800 flex items-center gap-2"><span>📝</span> 新增【{{ activeCategory.name }}】案件</h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">日期</label>
              <input v-model="form.date" type="date" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition cursor-pointer">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">辦理情形 (燈號進度)</label>
              <div class="grid grid-cols-3 gap-2">
                <button type="button" @click="form.lightColor = 'yellow'" :class="['py-2 px-3 rounded-xl text-xs font-bold transition border cursor-pointer', form.lightColor === 'yellow' ? 'bg-amber-50 border-amber-400 text-amber-700' : 'bg-slate-50 border-slate-200 text-slate-600']">🟡 黃燈</button>
                <button type="button" @click="form.lightColor = 'green'" :class="['py-2 px-3 rounded-xl text-xs font-bold transition border cursor-pointer', form.lightColor === 'green' ? 'bg-emerald-50 border-emerald-400 text-emerald-700' : 'bg-slate-50 border-slate-200 text-slate-600']">🟢 綠燈</button>
                <button type="button" @click="form.lightColor = 'red'" :class="['py-2 px-3 rounded-xl text-xs font-bold transition border cursor-pointer', form.lightColor === 'red' ? 'bg-rose-50 border-rose-400 text-rose-700' : 'bg-slate-50 border-slate-200 text-slate-600']">🔴 紅燈</button>
              </div>
            </div>
          </div>

          <div class="space-y-4 pt-2 border-t border-slate-100">
            <tag-manager label="承辦單位" icon="🏢" v-model="form.units" :options="tags.units" @add="addTag('units', $event)" @edit="editTag('units', $event)" @remove="removeTag('units', $event)"></tag-manager>
            <tag-manager label="負責人" icon="👤" v-model="form.persons" :options="tags.persons" @add="addTag('persons', $event)" @edit="editTag('persons', $event)" @remove="removeTag('persons', $event)"></tag-manager>
          </div>

          <div class="pt-2 border-t border-slate-100">
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">事件主旨 <span class="text-rose-500">*</span></label>
            <input v-model="form.subject" type="text" placeholder="請輸入主旨..." class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm font-semibold focus:bg-white focus:outline-none">
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-semibold text-slate-600">詳細說明與草稿</label>
              <button type="button" @click="localAiRefine" class="inline-flex items-center gap-1 text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1 rounded-lg transition border border-indigo-200/60 cursor-pointer"><span>✨</span> 免 API 一鍵說明語氣潤飾</button>
            </div>
            <textarea v-model="form.description" placeholder="請輸入說明..." rows="3" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm focus:bg-white focus:outline-none"></textarea>
          </div>

          <!-- 登錄雲端硬碟網址欄位 -->
          <div class="p-4 rounded-xl border border-dashed border-blue-200 bg-blue-50/40 space-y-2">
            <label class="block text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <span>🔗</span> 登錄 Google 雲端硬碟網址 (檔案或資料夾分享連結)
            </label>
            <input v-model="form.fileUrl" type="url" placeholder="https://drive.google.com/..." class="w-full bg-white border border-slate-200 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
          </div>

          <div class="flex justify-end pt-2">
            <button @click="handleSubmitRecord" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-xl shadow-md transition cursor-pointer">
              💾 儲存案件
            </button>
          </div>
        </section>

        <!-- 看板檢核區 -->
        <section class="space-y-6">
          <div class="bg-white rounded-2xl border-2 border-amber-200/80 shadow-sm p-4 divide-y divide-slate-100">
            <h4 class="font-bold text-amber-900 mb-2">🟡 辦理中 ({{ currentCategoryRecords.yellow.length }})</h4>
            <record-item v-for="item in currentCategoryRecords.yellow" :key="item.id" :record="item" @update-record="handleUpdateRecord" @change-light="updateRecordLight(item, $event)" @delete="deleteRecord(item.id)"></record-item>
          </div>
          <div class="bg-white rounded-2xl border-2 border-emerald-200/80 shadow-sm p-4 divide-y divide-slate-100">
            <h4 class="font-bold text-emerald-900 mb-2">🟢 已完成 ({{ currentCategoryRecords.green.length }})</h4>
            <record-item v-for="item in currentCategoryRecords.green" :key="item.id" :record="item" @update-record="handleUpdateRecord" @change-light="updateRecordLight(item, $event)" @delete="deleteRecord(item.id)"></record-item>
          </div>
          <div class="bg-white rounded-2xl border-2 border-rose-200/80 shadow-sm p-4 divide-y divide-slate-100">
            <h4 class="font-bold text-rose-900 mb-2">🔴 卡關/待決 ({{ currentCategoryRecords.red.length }})</h4>
            <record-item v-for="item in currentCategoryRecords.red" :key="item.id" :record="item" @update-record="handleUpdateRecord" @change-light="updateRecordLight(item, $event)" @delete="deleteRecord(item.id)"></record-item>
          </div>
        </section>
      </template>

      <!-- 視圖 2：定期評量出題 -->
      <template v-else-if="activeView === 'exam'">
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
          <h2 class="text-2xl font-bold text-slate-800">📐 定期評量出題分配</h2>
          <button @click="addExamSchedule" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow transition cursor-pointer">➕ 新增學年度</button>
        </header>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <h3 class="text-sm font-bold text-slate-700">🏷️ 出題老師標籤庫</h3>
            <button @click="isManagingTeacherTags = !isManagingTeacherTags" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 cursor-pointer">
              {{ isManagingTeacherTags ? '完成編輯' : '⚙️ 編輯標籤' }}
            </button>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <span v-for="teacher in teacherList" :key="teacher" @click="fillActiveInput(teacher)" class="bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold px-3 py-1.5 rounded-xl flex items-center gap-1.5 cursor-pointer hover:bg-amber-100 transition">
              👤 {{ teacher }}
              <span v-if="isManagingTeacherTags" @click.stop="promptEditTeacher(teacher)" class="text-amber-600 ml-1">✏️</span>
              <span v-if="isManagingTeacherTags" @click.stop="promptRemoveTeacher(teacher)" class="text-rose-500">✕</span>
            </span>
            <button @click="promptAddTeacher" class="px-3.5 py-1.5 rounded-xl text-xs font-medium border-2 border-dashed border-slate-300 text-slate-500 hover:text-amber-600 cursor-pointer">➕ 創建老師標籤</button>
          </div>
        </section>

        <div class="space-y-6">
          <div v-for="(exam, index) in examSchedules" :key="exam.id" class="bg-white rounded-2xl border shadow-sm p-6 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <input v-model="exam.year" @change="saveLocalAndCloud" placeholder="學年度" class="w-24 bg-slate-50 border text-center rounded-lg text-sm font-bold p-1.5">
              <button @click="removeExamSchedule(index)" class="text-slate-400 hover:text-rose-600 text-xs font-bold cursor-pointer">🗑️ 刪除</button>
            </div>
            <table class="w-full text-center border-collapse border border-slate-200 text-sm">
              <thead class="bg-slate-100"><tr><th class="p-3 border">科目</th><th class="p-3 border text-blue-700">期中</th><th class="p-3 border text-emerald-700">期末</th></tr></thead>
              <tbody>
                <tr>
                  <td class="p-3 border font-bold bg-slate-50">📖 國語</td>
                  <td class="p-2 border"><input v-model="exam.midChinese" @focus="setActiveTarget(exam, 'midChinese')" @change="saveLocalAndCloud" class="w-full text-center p-2 text-xs border rounded-lg focus:outline-none"></td>
                  <td class="p-2 border"><input v-model="exam.finalChinese" @focus="setActiveTarget(exam, 'finalChinese')" @change="saveLocalAndCloud" class="w-full text-center p-2 text-xs border rounded-lg focus:outline-none"></td>
                </tr>
                <tr>
                  <td class="p-3 border font-bold bg-slate-50">🔢 數學</td>
                  <td class="p-2 border"><input v-model="exam.midMath" @focus="setActiveTarget(exam, 'midMath')" @change="saveLocalAndCloud" class="w-full text-center p-2 text-xs border rounded-lg focus:outline-none"></td>
                  <td class="p-2 border"><input v-model="exam.finalMath" @focus="setActiveTarget(exam, 'finalMath')" @change="saveLocalAndCloud" class="w-full text-center p-2 text-xs border rounded-lg focus:outline-none"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- 視圖 3：學年工作出題記錄 -->
      <template v-else-if="activeView === 'crossExam'">
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 mb-6">
          <h2 class="text-2xl font-bold text-slate-800">📚 學年工作出題記錄</h2>
        </header>
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
          <table class="w-full text-center border-collapse border border-slate-200 text-sm">
            <thead class="bg-slate-100"><tr><th class="p-3 border">考程階段</th><th class="p-3 border text-blue-700">國語</th><th class="p-3 border text-emerald-700">數學</th></tr></thead>
            <tbody>
              <tr v-for="item in crossExamData" :key="item.stageKey">
                <td class="p-4 border font-bold bg-slate-50">{{ item.stageName }}</td>
                <td class="p-3 border"><input v-model="item.chinese" @change="saveLocalAndCloud" class="w-full text-center p-2 text-xs border rounded-lg focus:outline-none"></td>
                <td class="p-3 border"><input v-model="item.math" @change="saveLocalAndCloud" class="w-full text-center p-2 text-xs border rounded-lg focus:outline-none"></td>
              </tr>
            </tbody>
          </table>
        </section>
      </template>

      <!-- 視圖 4：工作輪流順序登記 -->
      <template v-else-if="activeView === 'rotation'">
        <header class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 mb-6">
          <h2 class="text-2xl font-bold text-slate-800">🔄 工作輪流順序登記</h2>
          <button @click="promptAddDuty" class="bg-indigo-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer">➕ 建立新輪流工作</button>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div v-for="duty in rotationDuties" :key="duty.id" class="bg-white p-5 rounded-2xl shadow-sm border space-y-4">
            <div class="flex justify-between border-b pb-3">
              <h4 class="font-bold">📌 {{ duty.title }}</h4>
              <button @click="deleteDuty(duty.id)" class="text-slate-400 hover:text-rose-600">🗑️</button>
            </div>
            <div class="flex flex-wrap gap-2 p-3 bg-slate-50 rounded-xl border">
              <template v-for="(person, pIdx) in duty.members" :key="pIdx">
                <span class="bg-white border px-2 py-1 rounded-lg text-xs font-semibold">
                  <span class="text-indigo-600">#{{ pIdx + 1 }}</span> {{ person }}
                  <button @click="removeDutyMember(duty, pIdx)" class="text-rose-500 ml-1 cursor-pointer">✕</button>
                </span>
                <span v-if="pIdx < duty.members.length - 1" class="text-slate-400 text-xs">➔</span>
              </template>
            </div>
            <div class="flex gap-2">
              <input v-model="duty.newMemberInput" @keyup.enter="addDutyMember(duty)" placeholder="輸入姓名..." class="flex-1 bg-slate-50 border rounded-xl px-3 py-2 text-xs">
              <button @click="addDutyMember(duty)" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl text-xs cursor-pointer">加入</button>
            </div>
          </div>
        </div>
      </template>

    </main>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const TagManager = {
      props: ['label', 'icon', 'modelValue', 'options'],
      emits: ['update:modelValue', 'add', 'edit', 'remove'],
      template: `
        <div>
          <div class="flex justify-between mb-2">
            <div class="text-xs font-semibold text-slate-600"><span>{{ icon }}</span> {{ label }}：<span class="text-blue-600 ml-1">{{ modelValue.join('、') || '未選取' }}</span></div>
            <button @click="isManaging = !isManaging" class="text-[11px] px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 cursor-pointer">{{ isManaging ? '完成' : '⚙️ 管理' }}</button>
          </div>
          <div class="flex flex-wrap gap-2">
            <button v-for="opt in options" :key="opt" @click="toggleTag(opt)" :class="['px-3 py-1 text-xs border rounded cursor-pointer', modelValue.includes(opt) ? 'bg-blue-600 text-white' : 'bg-white']">
              {{ opt }}
              <span v-if="isManaging" @click.stop="promptEdit(opt)" class="ml-1 text-blue-300">✏️</span>
              <span v-if="isManaging" @click.stop="promptRemove(opt)" class="ml-1 text-rose-300">❌</span>
            </button>
            <button @click="promptAdd" class="px-3 py-1 text-xs border border-dashed rounded text-slate-500 cursor-pointer">➕ 新增</button>
          </div>
        </div>
      `,
      setup(props, { emit }) {
        const isManaging = ref(false);
        const toggleTag = (tag) => {
          if (isManaging.value) return;
          let list = [...props.modelValue];
          list.includes(tag) ? list = list.filter(i => i !== tag) : list.push(tag);
          emit('update:modelValue', list);
        };
        const promptAdd = () => { const v = prompt(`新增:`); if(v && v.trim()) emit('add', v.trim()); };
        const promptEdit = (o) => { const n = prompt(`修改:`, o); if(n && n.trim() && n !== o) emit('edit', { oldVal: o, newVal: n.trim() }); };
        const promptRemove = (v) => { if(confirm(`確定刪除?`)) emit('remove', v); };
        return { isManaging, toggleTag, promptAdd, promptEdit, promptRemove };
      }
    };

    const RecordItem = {
      props: ['record'],
      emits: ['change-light', 'delete', 'update-record'],
      template: `
        <div class="py-3 flex flex-col md:flex-row justify-between gap-3 text-xs">
          <div v-if="!isEditing" class="flex-1 space-y-1">
            <div class="flex gap-1.5 flex-wrap">
              <span class="bg-slate-100 px-2 py-0.5 rounded">{{ record.date }}</span>
              <span v-for="u in record.units" :key="u" class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded">🏢 {{ u }}</span>
              <span v-for="p in record.persons" :key="p" class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded">👤 {{ p }}</span>
            </div>
            <p class="font-bold text-sm">{{ record.subject }}</p>
            <p v-if="record.description" class="whitespace-pre-wrap text-slate-600">{{ record.description }}</p>
            <a v-if="record.fileUrl" :href="record.fileUrl" target="_blank" class="text-blue-600 hover:underline">📎 檢視附件或連結</a>
            <button @click="startEdit" class="text-slate-400 hover:text-blue-600 mt-1 block">✏️ 編輯</button>
          </div>
          <div v-else class="flex-1 space-y-2 bg-slate-50 p-2 rounded border">
            <input v-model="editForm.date" type="date" class="border p-1 rounded w-full">
            <input v-model="editForm.subject" placeholder="主旨" class="border p-1 rounded w-full font-bold">
            <input v-model="editForm.unitsStr" placeholder="單位 (逗號分隔)" class="border p-1 rounded w-full">
            <input v-model="editForm.personsStr" placeholder="負責人 (逗號分隔)" class="border p-1 rounded w-full">
            <textarea v-model="editForm.description" placeholder="說明" class="border p-1 rounded w-full"></textarea>
            <input v-model="editForm.fileUrl" placeholder="網址連結" class="border p-1 rounded w-full">
            <div class="flex gap-2">
              <button @click="saveEdit" class="bg-blue-600 text-white px-3 py-1 rounded">儲存</button>
              <button @click="isEditing = false" class="bg-slate-200 px-3 py-1 rounded">取消</button>
            </div>
          </div>
          <div class="flex gap-2 shrink-0">
            <select :value="record.lightColor" @change="$emit('change-light', $event.target.value)" class="border rounded p-1">
              <option value="yellow">🟡</option><option value="green">🟢</option><option value="red">🔴</option>
            </select>
            <button @click="$emit('delete')" class="text-rose-500 p-1">🗑️</button>
          </div>
        </div>
      `,
      setup(props, { emit }) {
        const isEditing = ref(false);
        const editForm = ref({});
        const startEdit = () => {
          editForm.value = {
            date: props.record.date, subject: props.record.subject, description: props.record.description || '',
            unitsStr: (props.record.units || []).join(','), personsStr: (props.record.persons || []).join(','), fileUrl: props.record.fileUrl || ''
          };
          isEditing.value = true;
        };
        const saveEdit = () => {
          if (!editForm.value.subject.trim()) return alert('主旨不得為空！');
          const updatedRecord = {
            ...props.record,
            date: editForm.value.date, subject: editForm.value.subject.trim(), description: editForm.value.description.trim(), fileUrl: editForm.value.fileUrl.trim(),
            units: editForm.value.unitsStr.split(',').map(s=>s.trim()).filter(Boolean),
            persons: editForm.value.personsStr.split(',').map(s=>s.trim()).filter(Boolean)
          };
          emit('update-record', updatedRecord);
          isEditing.value = false;
        };
        return { isEditing, editForm, startEdit, saveEdit };
      }
    };

    createApp({
      components: { TagManager, RecordItem },
      setup() {
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxSVJg9wRZryvZNjULjDrA5azW4Y8pXJ3hfTHsHwGJeeqaHgNO--domMpPZNo17GTQ_/exec';
        
        const activeView = ref('records');
        const categories = [{ id: 'official', name: '公文法規', icon: '📜' }, { id: 'decision', name: '行政決議', icon: '⚖️' }, { id: 'academic', name: '學年會議', icon: '🏫' }, { id: 'discussion', name: '建議討論', icon: '💡' }];
        const currentCategory = ref('official');
        
        const syncStatus = ref('synced');
        const syncStatusText = ref('本機與雲端同步完成');
        const lastSyncTime = ref('');

        const tags = ref({ units: ['教務處', '學務處'], persons: ['主任', '組長'] });
        
        // --- ★ 修復遺失的 teacherList 與 isManagingTeacherTags ---
        const teacherList = ref(['王老師', '李老師', '陳老師', '張老師', '林老師', '趙老師']);
        const isManagingTeacherTags = ref(false);
        // --------------------------------------------------------
        
        const examSchedules = ref([]);
        const crossExamData = ref([
          { stageKey: '5_mid', stageName: '五年級期中考', chinese: '', math: '' },
          { stageKey: '5_final', stageName: '五年級期末考', chinese: '', math: '' },
          { stageKey: '6_mid', stageName: '六年級期中考', chinese: '', math: '' },
          { stageKey: '6_final', stageName: '六年級期末考', chinese: '', math: '' }
        ]);
        const rotationDuties = ref([]);
        const records = ref([]);
        
        const form = ref({ date: new Date().toISOString().split('T')[0], lightColor: 'yellow', units: [], persons: [], subject: '', description: '', fileUrl: '', file: null });

        const activeCategory = computed(() => categories.find(c => c.id === currentCategory.value) || categories[0]);
        const countByCategory = (id) => records.value.filter(r => r.category === id).length;
        const currentCategoryRecords = computed(() => {
          const list = records.value.filter(r => r.category === currentCategory.value).sort((a,b) => new Date(b.date) - new Date(a.date));
          return { yellow: list.filter(r => r.lightColor === 'yellow'), green: list.filter(r => r.lightColor === 'green'), red: list.filter(r => r.lightColor === 'red') };
        });

        const activeTarget = ref(null);
        const setActiveTarget = (obj, field) => { activeTarget.value = { obj, field }; };
        const fillActiveInput = (t) => { if(activeTarget.value && !isManagingTeacherTags.value) { activeTarget.value.obj[activeTarget.value.field] = t; saveLocalAndCloud(); } };

        const saveLocalAndCloud = () => { 
          localStorage.setItem('ADMIN_APP_DATA_V9', JSON.stringify({ records: records.value, tags: tags.value, teacherList: teacherList.value, examSchedules: examSchedules.value, crossExamData: crossExamData.value, rotationDuties: rotationDuties.value }));
          syncStatusText.value = '已暫存至本機'; 
          lastSyncTime.value = new Date().toLocaleTimeString(); 
          // 雲端同步邏輯略
        };
        
        const fetchCloudData = () => { 
          const cached = localStorage.getItem('ADMIN_APP_DATA_V9');
          if (cached) {
            const data = JSON.parse(cached);
            if (data.records) records.value = data.records;
            if (data.tags) tags.value = data.tags;
            if (data.teacherList) teacherList.value = data.teacherList;
            if (data.examSchedules) examSchedules.value = data.examSchedules;
            if (data.crossExamData) crossExamData.value = data.crossExamData;
            if (data.rotationDuties) rotationDuties.value = data.rotationDuties;
          }
        };

        const addTag = (t, v) => { tags.value[t].push(v); saveLocalAndCloud(); };
        const editTag = (t, o) => { tags.value[t] = tags.value[t].map(x => x === o.oldVal ? o.newVal : x); saveLocalAndCloud(); };
        const removeTag = (t, v) => { tags.value[t] = tags.value[t].filter(x => x !== v); saveLocalAndCloud(); };
        
        // --- ★ 補齊老師標籤的管理邏輯 ---
        const promptAddTeacher = () => { const v = prompt('新增出題老師姓名:'); if(v && v.trim()) { teacherList.value.push(v.trim()); saveLocalAndCloud(); } };
        const promptEditTeacher = (o) => { const n = prompt('修改出題老師姓名:', o); if(n && n.trim() !== o) { teacherList.value = teacherList.value.map(x => x === o ? n.trim() : x); saveLocalAndCloud(); } };
        const promptRemoveTeacher = (v) => { if(confirm(`確定刪除 ${v}？`)) { teacherList.value = teacherList.value.filter(x => x !== v); saveLocalAndCloud(); } };
        const assignTeacher = (obj, field, e) => { if(e.target.value) { obj[field] = e.target.value; saveLocalAndCloud(); e.target.value = ''; } };
        // -------------------------------
        
        const addExamSchedule = () => { examSchedules.value.unshift({ id: Date.now(), year: '', midChinese: '', finalChinese: '', midMath: '', finalMath: '' }); saveLocalAndCloud(); };
        const removeExamSchedule = (idx) => { examSchedules.value.splice(idx, 1); saveLocalAndCloud(); };
        
        const promptAddDuty = () => { const v = prompt('輪流工作:'); if(v) { rotationDuties.value.push({ id: Date.now(), title: v, members: [], newMemberInput: '' }); saveLocalAndCloud(); } };
        const deleteDuty = (id) => { rotationDuties.value = rotationDuties.value.filter(x => x.id !== id); saveLocalAndCloud(); };
        const addDutyMember = (d) => { if(d.newMemberInput) { d.members.push(d.newMemberInput); d.newMemberInput = ''; saveLocalAndCloud(); } };
        const removeDutyMember = (d, idx) => { d.members.splice(idx, 1); saveLocalAndCloud(); };

        const localAiRefine = () => {
          if (!form.value.description) return alert('請先輸入說明草稿！');
          let text = form.value.description;
          text = text.replace(/去做|去弄/g, '辦理').replace(/大家/g, '相關同仁').replace(/要開會/g, '召開會議研商');
          form.value.description = text.startsWith('【擬辦說明】') ? text : `【擬辦說明】\n${text}`;
        };

        const handleSubmitRecord = () => {
          if (!form.value.subject.trim()) return alert('請輸入主旨！');
          records.value.unshift({
            id: 'REC_' + Date.now(), category: currentCategory.value, date: form.value.date, lightColor: form.value.lightColor,
            units: [...form.value.units], persons: [...form.value.persons], subject: form.value.subject.trim(),
            description: form.value.description.trim(), fileUrl: form.value.fileUrl.trim()
          });
          form.value.subject = ''; form.value.description = ''; form.value.fileUrl = ''; 
          saveLocalAndCloud();
        };

        const handleUpdateRecord = (updatedRecord) => {
          const index = records.value.findIndex(r => r.id === updatedRecord.id);
          if (index !== -1) { records.value[index] = updatedRecord; saveLocalAndCloud(); }
        };

        const updateRecordLight = (r, v) => { r.lightColor = v; saveLocalAndCloud(); };
        const deleteRecord = (id) => { records.value = records.value.filter(r => r.id !== id); saveLocalAndCloud(); };

        onMounted(() => { fetchCloudData(); });

        return {
          // --- ★ 確保所有變數都回傳給畫面綁定 ---
          activeView, categories, currentCategory, activeCategory, countByCategory, currentCategoryRecords,
          syncStatus, syncStatusText, lastSyncTime, fetchCloudData,
          tags, addTag, editTag, removeTag, 
          teacherList, isManagingTeacherTags, promptAddTeacher, promptEditTeacher, promptRemoveTeacher, // 已補齊
          activeTarget, setActiveTarget, fillActiveInput, assignTeacher,
          examSchedules, addExamSchedule, removeExamSchedule, crossExamData,
          rotationDuties, promptAddDuty, deleteDuty, addDutyMember, removeDutyMember,
          form, localAiRefine, handleSubmitRecord, handleUpdateRecord, updateRecordLight, deleteRecord, saveLocalAndCloud, records
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
