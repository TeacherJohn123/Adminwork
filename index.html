<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政追蹤檢核網頁</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
  <div id="app" class="max-w-7xl mx-auto space-y-6">
    
    <header class="bg-white rounded-xl shadow-sm p-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-slate-800">🏫 行政工作追蹤檢核系統</h1>
      <button @click="loadRecords" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-sm transition">🔄 重新整理</button>
    </header>

    <section class="bg-white rounded-xl shadow-sm p-6">
      <h2 class="text-lg font-bold text-slate-700 mb-4">📝 新增/編輯案件</h2>
      
      <!-- 日期與燈號設定 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">日期</label>
          <input v-model="form.date" type="date" class="w-full border border-slate-300 p-2 rounded-lg text-sm bg-white cursor-pointer">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">燈號進度</label>
          <select v-model="form.light" class="w-full border border-slate-300 p-2 rounded-lg text-sm">
            <option value="green">🟢 綠燈 (順利/已辦理)</option>
            <option value="yellow">🟡 黃燈 (討論中/注意)</option>
            <option value="red">🔴 紅燈 (卡關/否決)</option>
          </select>
        </div>
      </div>

      <!-- 標籤平鋪選擇區 (取代下拉選單) -->
      <div class="space-y-6 mb-6">
        <tag-selector label="討論形式" v-model="form.format" :options="tags.formats" @add="addTag('formats', $event)" @remove="removeTag('formats', $event)" @edit="editTag('formats', $event)"></tag-selector>
        <tag-selector label="會議名稱" v-model="form.meetingName" :options="tags.meetingNames" @add="addTag('meetingNames', $event)" @remove="removeTag('meetingNames', $event)" @edit="editTag('meetingNames', $event)"></tag-selector>
        <tag-selector label="主辦人員" v-model="form.organizer" :options="tags.organizers" @add="addTag('organizers', $event)" @remove="removeTag('organizers', $event)" @edit="editTag('organizers', $event)"></tag-selector>
        <tag-selector label="處理情形" v-model="form.status" :options="tags.statuses" @add="addTag('statuses', $event)" @remove="removeTag('statuses', $event)" @edit="editTag('statuses', $event)"></tag-selector>
      </div>

      <div class="mb-4">
        <label class="flex justify-between items-end text-xs text-slate-500 mb-1">
          <span class="font-bold text-sm text-slate-700">事件主旨</span>
          <button @click="localRefineText" class="text-blue-600 bg-blue-50 px-2 py-1 rounded hover:bg-blue-100 transition">✨ 智慧潤飾 (免API)</button>
        </label>
        <textarea v-model="form.subject" placeholder="請輸入事件主旨..." class="w-full border border-slate-300 p-3 rounded-lg text-sm h-24 focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div class="mb-6 p-4 border border-dashed border-slate-300 bg-slate-50 rounded-lg">
        <label class="block text-sm font-bold text-slate-700 mb-2">上傳會議紀錄 (PDF/Word) 以自動摘要</label>
        <input type="file" @change="handleFileUpload" class="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" accept=".pdf, .doc, .docx">
        <div v-if="isUploading" class="text-xs text-blue-600 mt-2 animate-pulse">⏳ 檔案上傳並交由 Gemini 閱讀中，請稍候...</div>
        <textarea v-if="form.summary" v-model="form.summary" class="w-full mt-3 p-3 border border-slate-200 rounded-lg text-sm bg-white min-h-[100px]" placeholder="AI 摘要結果將顯示於此..."></textarea>
      </div>

      <button @click="saveRecord" class="bg-slate-800 text-white px-6 py-2 rounded-lg shadow hover:bg-slate-700 transition w-full md:w-auto">💾 儲存案件紀錄</button>
    </section>

    <!-- 燈號分類呈現區 -->
    <div class="space-y-8 mt-8">
      <section>
        <h3 class="text-xl font-bold text-yellow-600 mb-4 border-b-2 border-yellow-200 pb-2">🟡 黃燈案件 (持續追蹤)</h3>
        <div class="grid gap-4"><record-card v-for="r in sortedRecords('yellow')" :key="r.id" :record="r"></record-card></div>
      </section>
      <section>
        <h3 class="text-xl font-bold text-emerald-600 mb-4 border-b-2 border-emerald-200 pb-2">🟢 綠燈案件 (順利/已結案)</h3>
        <div class="grid gap-4"><record-card v-for="r in sortedRecords('green')" :key="r.id" :record="r"></record-card></div>
      </section>
      <section>
        <h3 class="text-xl font-bold text-red-600 mb-4 border-b-2 border-red-200 pb-2">🔴 紅燈案件 (急需處理/否決)</h3>
        <div class="grid gap-4"><record-card v-for="r in sortedRecords('red')" :key="r.id" :record="r"></record-card></div>
      </section>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    // --- 全新平鋪式標籤選擇與編輯元件 ---
    const TagSelector = {
      props: ['label', 'modelValue', 'options'],
      emits: ['update:modelValue', 'add', 'remove', 'edit'],
      template: `
        <div class="border-b border-slate-100 pb-4">
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-bold text-slate-700">
              {{ label }}：<span class="text-blue-600 ml-1">{{ modelValue || '尚未選擇' }}</span>
            </label>
            <button @click="isEditing = !isEditing" class="text-xs px-3 py-1 rounded-full transition" :class="isEditing ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'">
              {{ isEditing ? '✅ 完成編輯' : '✏️ 編輯標籤' }}
            </button>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <button v-for="opt in options" :key="opt" @click="selectTag(opt)" 
              class="px-4 py-1.5 rounded-full text-sm font-medium transition shadow-sm border"
              :class="modelValue === opt ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-400 hover:bg-blue-50'">
              {{ opt }}
              <span v-if="isEditing" @click.stop="promptEdit(opt)" class="ml-2 text-blue-400 hover:text-blue-200 cursor-pointer text-xs">✏️</span>
              <span v-if="isEditing" @click.stop="promptRemove(opt)" class="ml-1 text-red-400 hover:text-red-200 cursor-pointer text-xs">❌</span>
            </button>
            <button @click="promptAdd" class="px-3 py-1.5 rounded-full text-sm border-2 border-dashed border-slate-300 text-slate-500 hover:bg-slate-100 transition">
              ➕ 新增
            </button>
          </div>
        </div>
      `,
      setup(props, { emit }) {
        const isEditing = ref(false);

        const selectTag = (opt) => {
          if (!isEditing.value) {
            emit('update:modelValue', props.modelValue === opt ? '' : opt); // 點擊第二次可取消選取
          }
        };
        const promptAdd = () => { 
          const val = prompt(`新增 [${props.label}] 標籤:`); 
          if(val && val.trim()) emit('add', val.trim()); 
        };
        const promptEdit = (oldVal) => {
          const newVal = prompt(`修改 [${props.label}] 標籤名稱:`, oldVal);
          if(newVal && newVal.trim() && newVal !== oldVal) emit('edit', { old: oldVal, new: newVal.trim() });
        };
        const promptRemove = (val) => { 
          if(confirm(`確定要刪除 [${val}] 標籤嗎？`)) {
            emit('remove', val);
            if(props.modelValue === val) emit('update:modelValue', ''); // 若刪除的是目前選取的，則清空
          }
        };

        return { isEditing, selectTag, promptAdd, promptEdit, promptRemove };
      }
    };

    const RecordCard = {
      props: ['record'],
      template: `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between gap-4">
          <div class="flex-1">
            <div class="flex flex-wrap items-center gap-2 mb-2">
              <span class="text-xs font-medium bg-slate-100 text-slate-600 px-2 py-1 rounded">{{ record.date.substring(0,10) }}</span>
              <span v-if="record.format" class="text-xs font-medium bg-indigo-50 text-indigo-600 px-2 py-1 rounded">{{ record.format }}</span>
              <span v-if="record.meetingName" class="text-xs font-medium bg-blue-50 text-blue-600 px-2 py-1 rounded">{{ record.meetingName }}</span>
              <span v-if="record.status" class="text-xs font-medium bg-slate-800 text-white px-2 py-1 rounded">{{ record.status }}</span>
            </div>
            <p class="font-bold text-slate-800 whitespace-pre-wrap">{{ record.subject }}</p>
            <div v-if="record.summary" class="mt-3 p-3 bg-slate-50 text-xs text-slate-600 rounded-lg border border-slate-200 whitespace-pre-wrap"><strong>AI 摘要：</strong>\n{{ record.summary }}</div>
          </div>
          <div class="flex flex-col items-end justify-between min-w-[120px]">
            <span class="text-sm font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-full border border-slate-300">👤 {{ record.organizer || '未指定' }}</span>
            <a v-if="record.fileUrl" :href="record.fileUrl" target="_blank" class="text-xs text-blue-500 hover:underline mt-2">📄 檢視附件</a>
          </div>
        </div>
      `
    };

    createApp({
      components: { TagSelector, RecordCard },
      setup() {
        // !!! 請確認這裡是您最新的 GAS Web App 網址 !!!
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxhygLRfVmToYROKGhMagpUABpA3u-TpX3rSjSDUmwJaj-xl2f8OX5Mv8SoHbrJA2IF/exec';

        const loadTags = () => {
          const defaultTags = {
            formats: ['會議', '學年會議記錄', '建議', '請求協助'],
            meetingNames: ['校務會議', '處室主管會議', '學年會議'],
            organizers: ['教務處', '學務處', '總務處', '輔導室'],
            statuses: ['討論中', '已辦理', '否決(請附理由)']
          };
          const saved = localStorage.getItem('adminSysTags');
          return saved ? JSON.parse(saved) : defaultTags;
        };
        const tags = ref(loadTags());

        const addTag = (category, val) => { if (!tags.value[category].includes(val)) tags.value[category].push(val); saveTags(); };
        const removeTag = (category, val) => { tags.value[category] = tags.value[category].filter(t => t !== val); saveTags(); };
        const editTag = (category, payload) => {
          const idx = tags.value[category].indexOf(payload.old);
          if(idx !== -1) {
            tags.value[category].splice(idx, 1, payload.new);
            saveTags();
          }
        };
        const saveTags = () => localStorage.setItem('adminSysTags', JSON.stringify(tags.value));

        const form = ref({ date: new Date().toISOString().split('T')[0], format: '', meetingName: '', organizer: '', status: '', light: 'yellow', subject: '', fileUrl: '', summary: '' });
        const records = ref([]);
        const isUploading = ref(false);

        const localRefineText = () => {
          if(!form.value.subject) return;
          let text = form.value.subject;
          const rules = [
            { match: /要/g, replace: '擬請' },
            { match: /想說/g, replace: '研擬' },
            { match: /大家/g, replace: '與會同仁' },
            { match: /弄好/g, replace: '辦理完竣' },
            { match: /可不可以/g, replace: '是否可行' },
            { match: /因為/g, replace: '查' }
          ];
          rules.forEach(rule => text = text.replace(rule.match, rule.replace));
          form.value.subject = `【行政主旨】${text}\n【擬辦說明】`;
        };

        const handleFileUpload = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          isUploading.value = true;
          const reader = new FileReader();
          reader.onload = async () => {
            const base64Data = reader.result.split(',')[1];
            try {
              const res = await fetch(GAS_API_URL, {
                method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'uploadAndSummarize', fileName: file.name, mimeType: file.type, fileData: base64Data })
              });
              const json = await res.json();
              if (json.status === 'success') {
                form.value.fileUrl = json.fileUrl;
                form.value.summary = json.summary;
              } else alert('處理失敗');
            } catch (e) { alert('上傳異常，請確認權限。'); } 
            finally { isUploading.value = false; event.target.value = ''; }
          };
          reader.readAsDataURL(file);
        };

        const loadRecords = async () => {
          try {
            const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getRecords' }) });
            const json = await res.json();
            if(json.data) records.value = json.data;
          } catch(e) { console.error('讀取失敗', e); }
        };

        const saveRecord = async () => {
          if(!form.value.subject) return alert('請填寫主旨！');
          try {
            await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveRecord', ...form.value }) });
            form.value.subject = ''; form.value.fileUrl = ''; form.value.summary = '';
            loadRecords();
          } catch(e) { alert('儲存失敗'); }
        };

        const sortedRecords = (lightColor) => {
          return records.value
            .filter(r => r.light === lightColor)
            .sort((a, b) => new Date(a.date) - new Date(b.date));
        };

        onMounted(loadRecords);

        return { tags, form, records, isUploading, addTag, removeTag, editTag, localRefineText, handleFileUpload, loadRecords, saveRecord, sortedRecords };
      }
    }).mount('#app');
  </script>
</body>
</html>
