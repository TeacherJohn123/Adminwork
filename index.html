<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政工作輔助系統</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div id="app" class="max-w-7xl mx-auto space-y-6">
    
    <!-- 標題與同步狀態 -->
    <header class="bg-white rounded-lg shadow p-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">🏫 行政工作輔助系統</h1>
        <p class="text-sm text-gray-500 mt-1">本機快取 ＋ 雲端 Drive JSON 雙軌同步</p>
      </div>
      <div class="flex items-center space-x-3">
        <span class="text-sm font-bold" :class="syncStatusColor">{{ syncStatusText }}</span>
        <button @click="triggerCloudSync" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-2 rounded-lg text-sm transition">
          🔄 強制同步雲端
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      
      <!-- 左側：四大模組分類 -->
      <div class="lg:col-span-1 space-y-2">
        <div v-for="category in categories" :key="category" 
             @click="currentCategory = category"
             class="p-4 rounded-lg cursor-pointer font-bold transition shadow-sm"
             :class="currentCategory === category ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-indigo-50'">
          {{ category }}
        </div>
      </div>

      <!-- 右側：新增與列表 -->
      <div class="lg:col-span-3 space-y-6">
        
        <!-- 新增案件表單 -->
        <section class="bg-white rounded-lg shadow p-6 border-t-4 border-indigo-500">
          <h2 class="text-lg font-bold text-gray-700 mb-4">➕ 新增 [{{ currentCategory }}] 紀錄</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">事件主旨</label>
              <input v-model="newTask.subject" type="text" placeholder="輸入主旨..." class="w-full border p-2 rounded text-sm">
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">承辦單位</label>
                <input v-model="newTask.unit" type="text" placeholder="例：教務處" class="w-full border p-2 rounded text-sm">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">負責人</label>
                <input v-model="newTask.person" type="text" placeholder="例：王小明" class="w-full border p-2 rounded text-sm">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">辦理情形</label>
              <div class="flex space-x-2">
                <label class="flex-1 text-center py-2 rounded border cursor-pointer" :class="newTask.status === '綠燈' ? 'bg-green-100 border-green-500' : 'bg-gray-50'">
                  <input type="radio" v-model="newTask.status" value="綠燈" class="hidden"> 🟢 綠燈
                </label>
                <label class="flex-1 text-center py-2 rounded border cursor-pointer" :class="newTask.status === '黃燈' ? 'bg-yellow-100 border-yellow-500' : 'bg-gray-50'">
                  <input type="radio" v-model="newTask.status" value="黃燈" class="hidden"> 🟡 黃燈
                </label>
                <label class="flex-1 text-center py-2 rounded border cursor-pointer" :class="newTask.status === '紅燈' ? 'bg-red-100 border-red-500' : 'bg-gray-50'">
                  <input type="radio" v-model="newTask.status" value="紅燈" class="hidden"> 🔴 紅燈
                </label>
              </div>
            </div>
            <button @click="saveRecord" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition">
              💾 儲存並同步
            </button>
          </div>
        </section>

        <!-- 案件列表 -->
        <section class="bg-white rounded-lg shadow p-6">
          <h2 class="text-lg font-bold text-gray-700 mb-4">📋 案件進度清單</h2>
          <div class="space-y-3">
            <div v-for="r in filteredRecords" :key="r.id" class="p-4 rounded border-l-4 shadow-sm bg-gray-50 flex justify-between items-center"
                 :class="{'border-green-500': r.status==='綠燈', 'border-yellow-500': r.status==='黃燈', 'border-red-500': r.status==='紅燈'}">
              <div>
                <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded mr-2">{{ r.date }}</span>
                <span class="font-bold text-gray-800">{{ r.subject }}</span>
                <div class="text-xs text-gray-500 mt-2">承辦：{{ r.unit }} | 負責人：{{ r.person }}</div>
              </div>
              <button @click="deleteRecord(r.id)" class="text-red-500 hover:bg-red-100 px-2 py-1 rounded text-xs">刪除</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const categories = ['公文法規', '行政決議', '學年會議', '建議討論'];
        const currentCategory = ref(categories[0]);
        const records = ref([]);
        
        const syncStatus = ref('idle'); // idle, syncing, synced, error
        const lastSyncTime = ref('');

        const newTask = ref({
          subject: '',
          unit: '',
          person: '',
          status: '黃燈'
        });

        // 狀態文字與顏色
        const syncStatusText = computed(() => {
          if (syncStatus.value === 'idle') return '等待同步...';
          if (syncStatus.value === 'syncing') return '🔄 雲端同步中...';
          if (syncStatus.value === 'synced') return `✅ 已同步 (${lastSyncTime.value})`;
          return '❌ 同步失敗 (離線模式)';
        });
        const syncStatusColor = computed(() => {
          if (syncStatus.value === 'synced') return 'text-green-600';
          if (syncStatus.value === 'error') return 'text-red-600';
          return 'text-gray-500';
        });

        const filteredRecords = computed(() => {
          return records.value.filter(r => r.category === currentCategory.value).reverse();
        });

        // 1. 讀取本機資料 (第一步：秒開)
        const loadLocalCache = () => {
          const cached = localStorage.getItem('adminSystemData');
          if (cached) {
            try {
              const parsed = JSON.parse(cached);
              records.value = parsed.records || [];
            } catch (e) {}
          }
        };

        // 2. 從 Google Drive 拉取最新 JSON (第二步：雲端更新)
        const fetchCloudData = () => {
          syncStatus.value = 'syncing';
          google.script.run.withSuccessHandler((responseStr) => {
            try {
              const json = JSON.parse(responseStr);
              if (json.records) {
                records.value = json.records;
                localStorage.setItem('adminSystemData', JSON.stringify({ records: records.value }));
                syncStatus.value = 'synced';
                lastSyncTime.value = new Date().toLocaleTimeString('zh-TW');
              }
            } catch (e) {
              syncStatus.value = 'error';
            }
          }).withFailureHandler((err) => {
            syncStatus.value = 'error';
          }).loadDataFromDrive();
        };

        // 3. 將資料寫入本機與雲端 JSON
        const triggerCloudSync = () => {
          syncStatus.value = 'syncing';
          const dataStr = JSON.stringify({ records: records.value });
          
          // 寫入本地
          localStorage.setItem('adminSystemData', dataStr);
          
          // 寫入雲端 Drive
          google.script.run.withSuccessHandler((res) => {
            const result = JSON.parse(res);
            if (result.status === 'success') {
              syncStatus.value = 'synced';
              lastSyncTime.value = new Date().toLocaleTimeString('zh-TW');
            } else {
              syncStatus.value = 'error';
            }
          }).withFailureHandler((err) => {
            syncStatus.value = 'error';
          }).saveDataToDrive(dataStr);
        };

        // 新增案件
        const saveRecord = () => {
          if (!newTask.value.subject) return alert('請填寫主旨！');
          records.value.push({
            id: 'T_' + new Date().getTime(),
            category: currentCategory.value,
            date: new Date().toISOString().split('T')[0],
            subject: newTask.value.subject,
            unit: newTask.value.unit,
            person: newTask.value.person,
            status: newTask.value.status
          });
          
          // 清空表單
          newTask.value.subject = '';
          
          // 觸發雙軌儲存
          triggerCloudSync();
        };

        // 刪除案件
        const deleteRecord = (id) => {
          if (confirm('確定要刪除這筆紀錄嗎？')) {
            records.value = records.value.filter(r => r.id !== id);
            triggerCloudSync();
          }
        };

        onMounted(() => {
          loadLocalCache(); // 先秒開本地資料
          fetchCloudData(); // 再到背景去抓 Google Drive 最新檔案
        });

        return {
          categories, currentCategory, records, newTask, filteredRecords,
          syncStatusText, syncStatusColor, saveRecord, deleteRecord, triggerCloudSync
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
