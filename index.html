<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政工作雙軌同步管理系統</title>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    button:disabled {
      cursor: not-allowed !important;
    }

    input,
    textarea,
    select {
      -webkit-appearance: none;
      appearance: none;
    }

    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

<div id="app" class="flex flex-col md:flex-row min-h-screen">

  <!-- =========================================================
       左側導航
  ========================================================== -->
  <aside
    class="w-full md:w-80 bg-slate-900 text-slate-200 flex flex-col justify-between shrink-0 shadow-xl overflow-y-auto"
  >

    <div>

      <!-- 標題 -->
      <div class="p-5 border-b border-slate-800">
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
          <span>🏫</span>
          行政工作管理
        </h1>

        <p class="text-xs text-slate-400 mt-1">
          雙軌同步 ‧ 歷程檢核看板
        </p>
      </div>

      <!-- 主功能 -->
      <div class="p-3 space-y-1">

        <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider px-3 mb-1">
          主功能區
        </div>

        <!-- 案件 -->
        <button
          @click="activeView = 'records'"
          :class="[
            'w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold transition cursor-pointer',
            activeView === 'records'
              ? 'bg-blue-600 text-white shadow-md'
              : 'text-slate-300 hover:bg-slate-800'
          ]"
        >
          <span class="flex items-center gap-2">
            <span>📂</span>
            業務案件看板
          </span>

          <span class="bg-blue-500/50 px-2 py-0.5 rounded-full text-[10px]">
            {{ records.length }}
          </span>
        </button>

        <!-- 輪值 -->
        <button
          @click="activeView = 'rotation'"
          :class="[
            'w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold transition cursor-pointer',
            activeView === 'rotation'
              ? 'bg-indigo-600 text-white shadow-md'
              : 'text-slate-300 hover:bg-slate-800'
          ]"
        >
          <span class="flex items-center gap-2">
            <span>🔄</span>
            工作輪流順序登記
          </span>

          <span class="bg-indigo-500/50 px-2 py-0.5 rounded-full text-[10px]">
            {{ rotationDuties.length }} 項
          </span>
        </button>

        <!-- 定期評量 -->
        <button
          @click="activeView = 'exam'"
          :class="[
            'w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold transition cursor-pointer',
            activeView === 'exam'
              ? 'bg-amber-600 text-white shadow-md'
              : 'text-slate-300 hover:bg-slate-800'
          ]"
        >
          <span class="flex items-center gap-2">
            <span>📐</span>
            定期評量出題
          </span>

          <span class="bg-amber-500/50 px-2 py-0.5 rounded-full text-[10px]">
            {{ examSchedules.length }} 年
          </span>
        </button>

      </div>

      <!-- 業務分類 -->
      <nav
        v-if="activeView === 'records'"
        class="px-3 pb-3 space-y-1 border-t border-slate-800 pt-3 mt-2"
      >

        <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider px-3 my-1">
          業務分類
        </div>

        <button
          v-for="cat in categories"
          :key="cat.id"
          @click="currentCategory = cat.id"
          :class="[
            'w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium transition cursor-pointer',
            currentCategory === cat.id
              ? 'bg-slate-800 text-blue-400 font-bold border-l-4 border-blue-500'
              : 'text-slate-400 hover:bg-slate-800 hover:text-white'
          ]"
        >

          <div class="flex items-center gap-2">
            <span>{{ cat.icon }}</span>
            <span>{{ cat.name }}</span>
          </div>

          <span
            class="text-[10px] px-1.5 py-0.5 rounded-full"
            :class="
              currentCategory === cat.id
                ? 'bg-blue-500 text-white'
                : 'bg-slate-800 text-slate-400'
            "
          >
            {{ countByCategory(cat.id) }}
          </span>

        </button>

      </nav>

    </div>

    <!-- 同步狀態 -->
    <div class="p-4 border-t border-slate-800 text-xs bg-slate-950/40">

      <div class="flex items-center justify-between mb-2">

        <span class="text-slate-400">
          同步狀態
        </span>

        <span
          class="inline-flex items-center gap-1.5 font-medium"
          :class="{
            'text-slate-400': syncStatus === 'idle',
            'text-emerald-400': syncStatus === 'synced',
            'text-amber-400': syncStatus === 'syncing',
            'text-rose-400': syncStatus === 'error'
          }"
        >

          <span class="relative flex h-2 w-2">

            <span
              v-if="syncStatus === 'syncing'"
              class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"
            ></span>

            <span
              class="relative inline-flex rounded-full h-2 w-2"
              :class="{
                'bg-slate-500': syncStatus === 'idle',
                'bg-emerald-500': syncStatus === 'synced',
                'bg-amber-500': syncStatus === 'syncing',
                'bg-rose-500': syncStatus === 'error'
              }"
            ></span>

          </span>

          {{ syncStatusText }}

        </span>

      </div>

      <div
        v-if="lastSyncTime"
        class="text-[10px] text-slate-500 mb-2"
      >
        最後同步：{{ lastSyncTime }}
      </div>

      <button
        @click="fetchCloudData"
        :disabled="syncStatus === 'syncing'"
        class="w-full mt-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5 border border-slate-700 disabled:opacity-50 cursor-pointer"
      >
        <span>🔄</span>
        手動同步雲端
      </button>

    </div>

  </aside>


  <!-- =========================================================
       主工作區
  ========================================================== -->
  <main
    class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-8 overflow-y-auto"
  >

    <!-- =====================================================
         VIEW A：案件
    ====================================================== -->
    <template v-if="activeView === 'records'">

      <!-- 標題 -->
      <header
        class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80"
      >

        <div class="flex items-center gap-3">

          <div
            class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl font-bold"
          >
            {{ activeCategory.icon }}
          </div>

          <div>

            <h2 class="text-2xl font-bold text-slate-800">
              {{ activeCategory.name }}
            </h2>

            <p class="text-xs text-slate-500 mt-0.5">
              案件內容、與會人員與後續發展歷程皆可隨時編輯修訂
            </p>

          </div>

        </div>

        <div
          class="text-xs text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg self-start sm:self-auto"
        >
          最後同步：
          {{ lastSyncTime || '尚未同步' }}
        </div>

      </header>


      <!-- 新增案件 -->
      <section
        class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80"
      >

        <h3 class="text-base font-bold text-slate-800 mb-5 flex items-center gap-2">
          <span>📝</span>
          新增【{{ activeCategory.name }}】案件
        </h3>


        <!-- 日期 / 燈號 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">

          <div>

            <label class="block text-xs font-semibold text-slate-600 mb-1.5">
              日期
            </label>

            <input
              v-model="form.date"
              type="date"
              class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition cursor-pointer"
            >

          </div>


          <div>

            <label class="block text-xs font-semibold text-slate-600 mb-1.5">
              辦理情形
            </label>

            <div class="grid grid-cols-3 gap-2">

              <button
                type="button"
                @click="form.lightColor = 'yellow'"
                :class="[
                  'py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 border cursor-pointer',
                  form.lightColor === 'yellow'
                    ? 'bg-amber-50 border-amber-400 text-amber-700 ring-2 ring-amber-400/20 shadow-sm'
                    : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                ]"
              >
                🟡 黃燈
              </button>

              <button
                type="button"
                @click="form.lightColor = 'green'"
                :class="[
                  'py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 border cursor-pointer',
                  form.lightColor === 'green'
                    ? 'bg-emerald-50 border-emerald-400 text-emerald-700 ring-2 ring-emerald-400/20 shadow-sm'
                    : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                ]"
              >
                🟢 綠燈
              </button>

              <button
                type="button"
                @click="form.lightColor = 'red'"
                :class="[
                  'py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 border cursor-pointer',
                  form.lightColor === 'red'
                    ? 'bg-rose-50 border-rose-400 text-rose-700 ring-2 ring-rose-400/20 shadow-sm'
                    : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                ]"
              >
                🔴 紅燈
              </button>

            </div>

          </div>

        </div>


        <!-- 標籤 -->
        <div class="space-y-4 mb-5 pt-2 border-t border-slate-100">

          <tag-manager
            label="承辦單位"
            icon="🏢"
            v-model="form.units"
            :options="tags.units"
            @add="addTag('units', $event)"
            @edit="editTag('units', $event)"
            @remove="removeTag('units', $event)"
          ></tag-manager>

          <tag-manager
            label="負責人"
            icon="👤"
            v-model="form.persons"
            :options="tags.persons"
            @add="addTag('persons', $event)"
            @edit="editTag('persons', $event)"
            @remove="removeTag('persons', $event)"
          ></tag-manager>

          <tag-manager
            label="與會人員"
            icon="👥"
            v-model="form.attendees"
            :options="tags.attendees"
            @add="addTag('attendees', $event)"
            @edit="editTag('attendees', $event)"
            @remove="removeTag('attendees', $event)"
          ></tag-manager>

        </div>


        <!-- 主旨 -->
        <div class="mb-4 pt-2 border-t border-slate-100">

          <label class="block text-xs font-semibold text-slate-600 mb-1.5">
            事件主旨
            <span class="text-rose-500">
              * 看板將預設顯示此主旨
            </span>
          </label>

          <input
            v-model="form.subject"
            type="text"
            placeholder="請輸入精簡事件主旨..."
            class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
            @keyup.enter="handleSubmitRecord"
          >

        </div>


        <!-- 詳細說明 -->
        <div class="mb-4">

          <div class="flex items-center justify-between mb-1.5">

            <label class="block text-xs font-semibold text-slate-600">
              詳細內容說明與草稿
            </label>

            <button
              type="button"
              @click="localAiRefine"
              class="inline-flex items-center gap-1 text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1 rounded-lg transition border border-indigo-200/60 cursor-pointer"
            >
              ✨ 行政語氣潤飾
            </button>

          </div>

          <textarea
            v-model="form.description"
            placeholder="請輸入案件背景、擬辦方式或說明細節..."
            rows="4"
            class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition leading-relaxed"
          ></textarea>

        </div>


        <!-- 附件 -->
        <div class="mb-5">

          <input
            ref="fileInput"
            type="file"
            class="hidden"
            @change="handleFileSelect"
          >

          <div
            class="border border-dashed border-slate-300 rounded-xl p-4 bg-slate-50"
          >

            <div class="flex flex-col sm:flex-row sm:items-center gap-3">

              <button
                type="button"
                @click="fileInput?.click()"
                class="bg-white border border-slate-300 hover:bg-slate-100 px-4 py-2 rounded-xl text-xs font-semibold text-slate-700 transition cursor-pointer"
              >
                📎 選擇附件
              </button>

              <span
                v-if="form.file"
                class="text-xs text-slate-600 break-all"
              >
                已選擇：
                <strong>{{ form.file.name }}</strong>
              </span>

              <button
                v-if="form.file"
                type="button"
                @click="clearSelectedFile"
                class="text-xs text-rose-500 hover:text-rose-700 cursor-pointer"
              >
                ✕ 移除附件
              </button>

              <span
                v-if="!form.file"
                class="text-xs text-slate-400"
              >
                可選擇 PDF、Word、Excel、圖片等附件
              </span>

            </div>

          </div>

        </div>


        <!-- 儲存 -->
        <div class="flex justify-end">

          <button
            @click="handleSubmitRecord"
            :disabled="isUploadingFile || syncStatus === 'syncing'"
            class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-xl shadow-md shadow-blue-600/20 transition duration-150 flex items-center justify-center gap-2 disabled:opacity-50 cursor-pointer"
          >

            <span v-if="!isUploadingFile">
              💾
            </span>

            <span v-else>
              ⏳
            </span>

            {{ isUploadingFile ? '附件上傳中...' : '儲存案件（雙軌同步）' }}

          </button>

        </div>

      </section>


      <!-- 案件看板 -->
      <section class="space-y-6">

        <div class="flex items-center justify-between">

          <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <span>📊</span>
            案件進度檢核看板
          </h3>

          <span class="text-xs text-slate-500">
            可編輯案件與追蹤歷程
          </span>

        </div>


        <!-- 黃燈 -->
        <div class="bg-white rounded-2xl border-2 border-amber-200/80 shadow-sm overflow-hidden">

          <div class="bg-amber-50/80 px-6 py-3.5 border-b border-amber-200 flex items-center justify-between">

            <h4 class="font-bold text-amber-900 flex items-center gap-2 text-sm md:text-base">
              🟡 辦理中 / 追蹤中
            </h4>

            <span class="bg-amber-200 text-amber-900 text-xs font-bold px-2.5 py-0.5 rounded-full">
              {{ currentCategoryRecords.yellow.length }} 件
            </span>

          </div>

          <div class="p-4 md:p-6 divide-y divide-slate-100">

            <div
              v-if="currentCategoryRecords.yellow.length === 0"
              class="text-xs text-slate-400 text-center py-6"
            >
              目前沒有進行中的黃燈案件
            </div>

            <record-item
              v-for="item in currentCategoryRecords.yellow"
              :key="item.id"
              :record="item"
              @update-record="updateRecord"
              @change-light="updateRecordLight(item, $event)"
              @delete="deleteRecord(item.id)"
              @add-log="handleAddLog(item, $event)"
              @edit-log="handleEditLog(item, $event)"
              @delete-log="handleDeleteLog(item, $event)"
            ></record-item>

          </div>

        </div>


        <!-- 綠燈 -->
        <div class="bg-white rounded-2xl border-2 border-emerald-200/80 shadow-sm overflow-hidden">

          <div class="bg-emerald-50/80 px-6 py-3.5 border-b border-emerald-200 flex items-center justify-between">

            <h4 class="font-bold text-emerald-900 flex items-center gap-2 text-sm md:text-base">
              🟢 已完成 / 結案
            </h4>

            <span class="bg-emerald-200 text-emerald-900 text-xs font-bold px-2.5 py-0.5 rounded-full">
              {{ currentCategoryRecords.green.length }} 件
            </span>

          </div>

          <div class="p-4 md:p-6 divide-y divide-slate-100">

            <div
              v-if="currentCategoryRecords.green.length === 0"
              class="text-xs text-slate-400 text-center py-6"
            >
              目前沒有已完成的綠燈案件
            </div>

            <record-item
              v-for="item in currentCategoryRecords.green"
              :key="item.id"
              :record="item"
              @update-record="updateRecord"
              @change-light="updateRecordLight(item, $event)"
              @delete="deleteRecord(item.id)"
              @add-log="handleAddLog(item, $event)"
              @edit-log="handleEditLog(item, $event)"
              @delete-log="handleDeleteLog(item, $event)"
            ></record-item>

          </div>

        </div>


        <!-- 紅燈 -->
        <div class="bg-white rounded-2xl border-2 border-rose-200/80 shadow-sm overflow-hidden">

          <div class="bg-rose-50/80 px-6 py-3.5 border-b border-rose-200 flex items-center justify-between">

            <h4 class="font-bold text-rose-900 flex items-center gap-2 text-sm md:text-base">
              🔴 未同意 / 待決策 / 卡關
            </h4>

            <span class="bg-rose-200 text-rose-900 text-xs font-bold px-2.5 py-0.5 rounded-full">
              {{ currentCategoryRecords.red.length }} 件
            </span>

          </div>

          <div class="p-4 md:p-6 divide-y divide-slate-100">

            <div
              v-if="currentCategoryRecords.red.length === 0"
              class="text-xs text-slate-400 text-center py-6"
            >
              目前沒有紅燈案件
            </div>

            <record-item
              v-for="item in currentCategoryRecords.red"
              :key="item.id"
              :record="item"
              @update-record="updateRecord"
              @change-light="updateRecordLight(item, $event)"
              @delete="deleteRecord(item.id)"
              @add-log="handleAddLog(item, $event)"
              @edit-log="handleEditLog(item, $event)"
              @delete-log="handleDeleteLog(item, $event)"
            ></record-item>

          </div>

        </div>

      </section>

    </template>


    <!-- =====================================================
         VIEW B：輪值
    ====================================================== -->
    <template v-else-if="activeView === 'rotation'">

      <header
        class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80"
      >

        <div class="flex items-center gap-3">

          <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl">
            🔄
          </div>

          <div>

            <h2 class="text-2xl font-bold text-slate-800">
              工作輪流順序登記
            </h2>

            <p class="text-xs text-slate-500 mt-0.5">
              自創輪值工作項目，排定順序並隨時檢視接續進度
            </p>

          </div>

        </div>

        <button
          @click="promptAddDuty"
          class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow transition cursor-pointer flex items-center gap-1.5"
        >
          ➕ 建立新輪流工作
        </button>

      </header>


      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <div
          v-for="duty in rotationDuties"
          :key="duty.id"
          class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5 space-y-4"
        >

          <div class="flex items-center justify-between border-b border-slate-100 pb-3">

            <div class="flex items-center gap-2">
              <span class="text-lg">📌</span>

              <h4 class="font-bold text-slate-800 text-base">
                {{ duty.title }}
              </h4>
            </div>

            <button
              @click="deleteDuty(duty.id)"
              class="text-slate-400 hover:text-rose-600 text-xs p-1 rounded-lg hover:bg-rose-50 transition cursor-pointer"
            >
              🗑️ 刪除項目
            </button>

          </div>


          <div class="space-y-2">

            <label class="block text-xs font-bold text-slate-600">
              輪值人員順序清單：
            </label>

            <div class="flex flex-wrap items-center gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200/70 min-h-[50px]">

              <template
                v-for="(person, pIdx) in duty.members"
                :key="`${duty.id}-${pIdx}`"
              >

                <div class="inline-flex items-center gap-1 bg-white border border-slate-200 px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-700 shadow-sm">

                  <span class="text-indigo-600 font-bold">
                    #{{ pIdx + 1 }}
                  </span>

                  <span>
                    {{ person }}
                  </span>

                  <button
                    @click="removeDutyMember(duty, pIdx)"
                    class="text-slate-300 hover:text-rose-500 font-bold ml-1 cursor-pointer"
                  >
                    ✕
                  </button>

                </div>

                <span
                  v-if="pIdx < duty.members.length - 1"
                  class="text-slate-400 text-xs"
                >
                  ➔
                </span>

              </template>

              <span
                v-if="duty.members.length === 0"
                class="text-xs text-slate-400"
              >
                目前尚無排定人員
              </span>

            </div>

          </div>

<script>

const {

/* =========================================================
   工具函式
========================================================= */

const getTaiwanToday = () => {

  const now = new Date();

  const taiwanTime = new Date(
    now.toLocaleString('en-US', {
      timeZone: 'Asia/Taipei'
    })
  );

  const year = taiwanTime.getFullYear();
  const month = String(taiwanTime.getMonth() + 1).padStart(2, '0');
  const day = String(taiwanTime.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
};


const nowTimeText = () => {

  return new Date().toLocaleTimeString(
    'zh-TW',
    {
      timeZone: 'Asia/Taipei',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    }
  );

};


const safeArray = (value) => {

  if (Array.isArray(value)) {
    return [...value];
  }

  if (typeof value === 'string') {

    return value
      .split(',')
      .map(v => v.trim())
      .filter(Boolean);

  }

  return [];

};


const normalizeRecord = (record) => {

  return {

    id: record.id || `REC_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,

    category: record.category || 'official',

    date: record.date || getTaiwanToday(),

    lightColor: ['yellow', 'green', 'red'].includes(record.lightColor)
      ? record.lightColor
      : 'yellow',

    units: safeArray(record.units),

    persons: safeArray(record.persons),

    attendees: safeArray(record.attendees),

    subject: String(record.subject || ''),

    description: String(record.description || ''),

    fileUrl: String(record.fileUrl || ''),

    fileName: String(record.fileName || ''),

    logs: Array.isArray(record.logs)
      ? record.logs.map(log => ({
          date: log.date || getTaiwanToday(),
          text: String(log.text || '')
        }))
      : []

  };

};


/* =========================================================
   TagManager
========================================================= */

const TagManager = {

  props: [
    'label',
    'icon',
    'modelValue',
    'options'
  ],

  emits: [
    'update:modelValue',
    'add',
    'edit',
    'remove'
  ],

  template: `

    <div>

      <div class="flex items-center justify-between mb-2">

        <div class="text-xs font-semibold text-slate-600 flex items-center gap-1">

          <span>{{ icon }}</span>

          <span>{{ label }}：</span>

          <span class="text-blue-600 font-bold ml-1">
            {{ displaySelected }}
          </span>

        </div>

        <button
          type="button"
          @click="isManaging = !isManaging"
          class="text-[11px] px-2.5 py-1 rounded-lg transition font-medium cursor-pointer"
          :class="
            isManaging
              ? 'bg-amber-100 text-amber-800'
              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          "
        >
          {{ isManaging ? '完成標籤管理' : '⚙️ 管理標籤' }}
        </button>

      </div>


      <div class="flex flex-wrap gap-2 items-center">

        <button
          type="button"
          v-for="opt in normalizedOptions"
          :key="opt"
          @click="toggleTag(opt)"
          :class="[
            'px-3.5 py-1.5 rounded-xl text-xs font-medium transition duration-150 border flex items-center gap-1.5 shadow-sm cursor-pointer',
            selected.includes(opt)
              ? 'bg-blue-600 text-white border-blue-600 font-semibold'
              : 'bg-white text-slate-700 border-slate-200 hover:border-blue-300 hover:bg-blue-50/50'
          ]"
        >

          <span>{{ opt }}</span>

          <span
            v-if="isManaging"
            @click.stop="promptEditTag(opt)"
            class="text-blue-300 hover:text-white cursor-pointer ml-1"
          >
            ✏️
          </span>

          <span
            v-if="isManaging"
            @click.stop="promptRemoveTag(opt)"
            class="text-rose-300 hover:text-rose-100 cursor-pointer"
          >
            ❌
          </span>

        </button>


        <button
          type="button"
          @click="promptAddTag"
          class="px-3 py-1.5 rounded-xl text-xs font-medium border-2 border-dashed border-slate-300 text-slate-500 hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50/30 transition cursor-pointer"
        >
          ➕ 新增標籤
        </button>

      </div>

    </div>

  `,

  computed: {

    normalizedOptions() {

      return Array.isArray(this.options)
        ? this.options
        : [];

    },

    selected() {

      return Array.isArray(this.modelValue)
        ? this.modelValue
        : safeArray(this.modelValue);

    },

    displaySelected() {

      return this.selected.length
        ? this.selected.join('、')
        : '未選取';

    }

  },

  setup(props, { emit }) {

    const isManaging = ref(false);


    const toggleTag = (tag) => {

      if (isManaging.value) {
        return;
      }

      const list = [...safeArray(props.modelValue)];

      const index = list.indexOf(tag);

      if (index >= 0) {

        list.splice(index, 1);

      } else {

        list.push(tag);

      }

      emit('update:modelValue', list);

    };


    const promptAddTag = () => {

      const value = prompt(
        `請輸入新增的 [${props.label}] 標籤名稱：`
      );

      if (
        value &&
        value.trim()
      ) {

        emit(
          'add',
          value.trim()
        );

      }

    };


    const promptEditTag = (oldVal) => {

      const value = prompt(
        `修改 [${props.label}] 標籤名稱：`,
        oldVal
      );

      if (
        value &&
        value.trim() &&
        value.trim() !== oldVal
      ) {

        emit(
          'edit',
          {
            oldVal,
            newVal: value.trim()
          }
        );

      }

    };


    const promptRemoveTag = (value) => {

      if (
        !confirm(
          `確定要刪除「${value}」標籤嗎？`
        )
      ) {
        return;
      }

      emit(
        'remove',
        value
      );

      const list = safeArray(props.modelValue)
        .filter(item => item !== value);

      emit(
        'update:modelValue',
        list
      );

    };


    return {
      isManaging,
      toggleTag,
      promptAddTag,
      promptEditTag,
      promptRemoveTag
    };

  }

};

            v-else
            class="text-slate-400 text-[11px]"
          >
            尚無後續追蹤歷程。
          </div>

        </div>

      </div>

    </div>

  `,

  setup(props, { emit }) {

    const isExpanded = ref(false);

    const newLogDate = ref(
      getTaiwanToday()
    );

    const newLogText = ref('');

    const isEditingRecord = ref(false);

    const editForm = ref({
      date: '',
      subject: '',
      description: '',
      unitsStr: '',
      personsStr: '',
      attendeesStr: ''
    });


    const startEditRecord = () => {

      editForm.value = {

        date: props.record.date || getTaiwanToday(),

        subject: props.record.subject || '',

        description: props.record.description || '',

        unitsStr: safeArray(props.record.units).join(', '),

        personsStr: safeArray(props.record.persons).join(', '),

        attendeesStr: safeArray(props.record.attendees).join(', ')

      };

      isEditingRecord.value = true;

    };


    const saveEditRecord = () => {

      const subject =
        editForm.value.subject.trim();

      if (!subject) {

        alert('主旨不得為空！');

        return;

      }


      const updatedRecord = {

        ...props.record,

        date:
          editForm.value.date || getTaiwanToday(),

        subject,

        description:
          editForm.value.description.trim(),

        units:
          safeArray(editForm.value.unitsStr),

        persons:
          safeArray(editForm.value.personsStr),

        attendees:
          safeArray(editForm.value.attendeesStr),

        logs: Array.isArray(props.record.logs)
          ? [...props.record.logs]
          : []

      };


      isEditingRecord.value = false;

      emit(
        'update-record',
        updatedRecord
      );

    };


    const cancelEditRecord = () => {

      isEditingRecord.value = false;

    };


    const editingLogIndex = ref(-1);

    const editLogDate = ref('');

    const editLogText = ref('');


    const startEditLog = (idx, log) => {

      editingLogIndex.value = idx;

      editLogDate.value =
        log.date || getTaiwanToday();

      editLogText.value =
        log.text || '';

    };


    const saveEditLog = (idx) => {

      const text =
        editLogText.value.trim();

      if (!text) {

        alert('追蹤內容不得為空！');

        return;

      }

      emit(
        'edit-log',
        {
          index: idx,
          date:
            editLogDate.value || getTaiwanToday(),
          text
        }
      );

      editingLogIndex.value = -1;

    };


    const parseTags = (value) => {

      return safeArray(value);

    };


    const submitLog = () => {

      const text =
        newLogText.value.trim();

      if (!text) {

        alert('請輸入後續追蹤內容！');

        return;

      }

      emit(
        'add-log',
        {
          date:
            newLogDate.value || getTaiwanToday(),
          text
        }
      );

      newLogText.value = '';

    };


    return {

      isExpanded,

      newLogDate,

      newLogText,

      parseTags,

      submitLog,

      isEditingRecord,

      editForm,

      startEditRecord,

      saveEditRecord,

      cancelEditRecord,

      editingLogIndex,

      editLogDate,

      editLogText,

      startEditLog,

      saveEditLog

    };

  }

};

    /* =====================================================

    const saveLocalCache = () => {

          '本機快取儲存失敗，可能是瀏覽器儲存空間不足。'
        );

    const loadLocalCache = () => {

      try {

        const cachedRecords =
          localStorage.getItem(
            CACHE_KEY_RECORDS
          );

        if (cachedRecords) {

          const parsed =
            JSON.parse(cachedRecords);

          records.value =

        const cachedTags =
          localStorage.getItem(
            CACHE_KEY_TAGS
          );

        if (cachedTags) {

          const parsed =
            JSON.parse(cachedTags);

          if (parsed && typeof parsed === 'object') {

            tags.value = {

              units:

                  : [...defaultTags.units],

                  : [...defaultTags.persons],

                  ? parsed.attendees
                  : [...defaultTags.attendees]

            };

        }


        const cachedExam =
          localStorage.getItem(

          );

        if (cachedExam) {

          const parsed =
            JSON.parse(cachedExam);

          if (Array.isArray(parsed)) {

        }


        const cachedRotation =

          );

    /* =====================================================

    let saveTimer = null;

    let isCloudSaving = false;

    let cloudSaveQueued = false;


    const saveLocalAndCloud = () => {

      saveLocalCache();

      scheduleCloudSave();

    };


    const scheduleCloudSave = () => {

      cloudSaveQueued = true;

      clearTimeout(saveTimer);

      saveTimer = setTimeout(

          triggerCloudSave();

        },
        500
      );

    };


    /* =====================================================
       雲端儲存
    ====================================================== */

    const triggerCloudSave = async () => {

      if (isCloudSaving) {

        cloudSaveQueued = true;

        return;

      }


      if (!cloudSaveQueued) {

        cloudSaveQueued = true;

      }


      cloudSaveQueued = false;

      isCloudSaving = true;

      syncStatus.value = 'syncing';


      try {

        const payload = {

          action: 'saveAll',

          records:
            records.value.map(normalizeRecord),

          tags:
            tags.value,

          examSchedules:
            examSchedules.value,

          rotationDuties:
            rotationDuties.value

        };


        const response =
          await fetch(
            GAS_API_URL,
            {

              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify(payload)

            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const json =
          await response.json();


        if (
          json.status !== 'success'
        ) {

          throw new Error(
            json.message ||
            'Google Apps Script 儲存失敗'
          );

        }


        syncStatus.value =
          'synced';

        lastSyncTime.value =
          nowTimeText();


      } catch (error) {

        console.error(
          '雲端儲存錯誤：',
          error
        );

        syncStatus.value =
          'error';

      } finally {

        isCloudSaving = false;


        if (cloudSaveQueued) {

          setTimeout(
            () => triggerCloudSave(),
            200
          );

        }

      }

    };


    /* =====================================================
       雲端讀取
    ====================================================== */

    const fetchCloudData = async () => {

      if (
        syncStatus.value === 'syncing'
      ) {

        return;

      }


      syncStatus.value =
        'syncing';


      try {

        const response =
          await fetch(
            `${GAS_API_URL}?action=getData`
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const json =
          await response.json();


        if (
          json.status !== 'success'
        ) {

          throw new Error(
            json.message ||
            '雲端資料讀取失敗'
          );

        }


        if (Array.isArray(json.records)) {

          records.value =
            json.records.map(normalizeRecord);

        }


        if (
          json.tags &&
          typeof json.tags === 'object'
        ) {

          tags.value = {

            units:
              Array.isArray(json.tags.units)
                ? json.tags.units
                : [...defaultTags.units],

            persons:
              Array.isArray(json.tags.persons)
                ? json.tags.persons
                : [...defaultTags.persons],

            attendees:
              Array.isArray(json.tags.attendees)
                ? json.tags.attendees
                : [...defaultTags.attendees]

          };

        }


        if (
          Array.isArray(
            json.examSchedules
          )
        ) {

          examSchedules.value =
            json.examSchedules;

        }


        if (
          Array.isArray(
            json.rotationDuties
          )
        ) {

            json.rotationDuties.map(

                id:
                  duty.id ||
                  `DUTY_${Date.now()}`,

                title:
                  duty.title || '未命名輪值工作',

                members:
                  Array.isArray(duty.members)
                    ? duty.members
                    : [],

                newMemberInput: ''

              })
            );

        }


        saveLocalCache();


        syncStatus.value =
          'synced';

        lastSyncTime.value =
          nowTimeText();


      } catch (error) {

        console.error(
          '雲端讀取錯誤：',
          error
        );

        syncStatus.value =
          'error';

      }

    };


    /* =====================================================
       標籤
    ====================================================== */

    const addTag = (
      type,
      value
    ) => {

      if (
        !tags.value[type]
      ) {

        tags.value[type] = [];

      }


      const cleanValue =
        String(value || '').trim();


      if (
        !cleanValue
      ) {

        return;

      }


      if (
        !tags.value[type].includes(
          cleanValue
        )
      ) {

        tags.value[type].push(
          cleanValue
        );

        saveLocalAndCloud();

      }

    };


    const editTag = (
      type,
      payload
    ) => {

      const {
        oldVal,
        newVal
      } = payload;


      const cleanNewVal =
        String(newVal || '').trim();


      if (
        !cleanNewVal
      ) {

        return;

      }


      if (
        !Array.isArray(
          tags.value[type]
        )
      ) {

        return;

      }


      const index =
        tags.value[type].indexOf(
          oldVal
        );


      if (index === -1) {

        return;

      }


      if (
        tags.value[type].includes(
          cleanNewVal
        )
      ) {

        alert(
          '新的標籤名稱已經存在。'
        );

        return;

      }


      tags.value[type].splice(
        index,
        1,
        cleanNewVal
      );


      /* 同步修改所有案件 */
      records.value =
        records.value.map(
          record => {

            const copy = {
              ...record
            };


            if (
              ['units', 'persons', 'attendees']
                .includes(type)
            ) {

              copy[type] =
                safeArray(
                  record[type]
                ).map(
                  item =>
                    item === oldVal
                      ? cleanNewVal
                      : item
                );

            }


            return copy;

          }
        );


      saveLocalAndCloud();

    };


    const removeTag = (
      type,
      value
    ) => {

      if (
        !Array.isArray(
          tags.value[type]
        )
      ) {

        return;

      }


      tags.value[type] =
        tags.value[type].filter(
          item =>
            item !== value
        );


      saveLocalAndCloud();

    };


    /* =====================================================
       案件
    ====================================================== */

    const updateRecord = (
      updatedRecord
    ) => {

      const index =
        records.value.findIndex(
          record =>
            record.id ===
            updatedRecord.id
        );


      if (index === -1) {

        return;

      }


      records.value[index] =
        normalizeRecord(
          updatedRecord
        );


      saveLocalAndCloud();

    };


    const updateRecordLight = (
      record,
      newLight
    ) => {

      if (
        !['yellow', 'green', 'red']
          .includes(newLight)
      ) {

        return;

      }


      const index =
        records.value.findIndex(
          item =>
            item.id === record.id
        );


      if (index === -1) {

        return;

      }


      records.value[index] = {

        ...records.value[index],

        lightColor:
          newLight

      };


      saveLocalAndCloud();

    };


    const deleteRecord = (
      id
    ) => {

      const record =
        records.value.find(
          item =>
            item.id === id
        );


      if (!record) {

        return;

      }


      if (
        !confirm(
          `確定要刪除案件「${record.subject}」嗎？\n\n此操作會同步更新雲端資料。`
        )
      ) {

        return;

      }


      records.value =
        records.value.filter(
          item =>
            item.id !== id
        );


      saveLocalAndCloud();

    };


    /* =====================================================
       追蹤紀錄
    ====================================================== */

    const handleAddLog = (
      record,
      log
    ) => {

      const index =
        records.value.findIndex(
          item =>
            item.id === record.id
        );


      if (index === -1) {

        return;

      }


      const logs =
        Array.isArray(
          records.value[index].logs
        )
          ? [
              ...records.value[index].logs
            ]
          : [];


      logs.push({

        date:
          log.date ||
          getTaiwanToday(),

        text:
          String(
            log.text || ''
          ).trim()

      });


      records.value[index] = {

        ...records.value[index],

        logs

      };


      saveLocalAndCloud();

    };


    const handleEditLog = (
      record,
      payload
    ) => {

      const index =
        records.value.findIndex(
          item =>
            item.id === record.id
        );


      if (index === -1) {

        return;

      }


      const logs =
        Array.isArray(
          records.value[index].logs
        )
          ? [
              ...records.value[index].logs
            ]
          : [];


      if (
        payload.index < 0 ||
        payload.index >= logs.length
      ) {

        return;

      }


      logs[payload.index] = {

        date:
          payload.date ||
          getTaiwanToday(),

        text:
          String(
            payload.text || ''
          ).trim()

      };


      records.value[index] = {

        ...records.value[index],

        logs

      };


      saveLocalAndCloud();

    };


    const handleDeleteLog = (
      record,
      logIndex
    ) => {

      const index =
        records.value.findIndex(
          item =>
            item.id === record.id
        );


      if (index === -1) {

        return;

      }


      if (
        !confirm(
          '確定要刪除這筆後續追蹤紀錄嗎？'
        )
      ) {

        return;

      }


      const logs =
        Array.isArray(
          records.value[index].logs
        )
          ? [
              ...records.value[index].logs
            ]
          : [];


      logs.splice(
        logIndex,
        1
      );


      records.value[index] = {

        ...records.value[index],

        logs

      };


      saveLocalAndCloud();

    };


    /* =====================================================
       新增案件
    ====================================================== */

    const fileToBase64 = (
      file
    ) => {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload = () => {

            const result =
              String(
                reader.result || ''
              );


            const commaIndex =
              result.indexOf(',');


            resolve(
              commaIndex >= 0
                ? result.substring(
                    commaIndex + 1
                  )
                : result
            );

          };


          reader.onerror =
            reject;


          reader.readAsDataURL(
            file
          );

        }
      );

    };


    const handleFileSelect = (
      event
    ) => {

      const file =
        event.target.files &&
        event.target.files[0];


      if (file) {

        form.value.file =
          file;

      }

    };


    const clearSelectedFile = () => {

      form.value.file =
        null;


      if (
        fileInput.value
      ) {

        fileInput.value.value =
          '';

      }

    };


    const handleSubmitRecord =
      async () => {

        const subject =
          form.value.subject.trim();


        if (!subject) {

          alert(
            '請填寫事件主旨！'
          );

          return;

        }


        if (
          !form.value.date
        ) {

          form.value.date =
            getTaiwanToday();

        }


        let uploadedFileUrl =
          '';

        let uploadedFileName =
          '';


        /* ===============================================
           附件上傳
        ================================================ */

        if (
          form.value.file
        ) {

          isUploadingFile.value =
            true;

          syncStatus.value =
            'syncing';


          try {

            const base64Data =
              await fileToBase64(
                form.value.file
              );


            const response =
              await fetch(
                GAS_API_URL,
                {

                  method: 'POST',

                  headers: {
                    'Content-Type':
                      'text/plain;charset=utf-8'
                  },

                  body:
                    JSON.stringify({

                      action:
                        'uploadFile',

                      fileName:
                        form.value.file.name,

                      mimeType:
                        form.value.file.type ||
                        'application/octet-stream',

                      fileData:
                        base64Data

                    })

                }
              );


            if (!response.ok) {

              throw new Error(
                `HTTP ${response.status}`
              );

            }


            const json =
              await response.json();


            if (
              json.status !== 'success'
            ) {

              throw new Error(
                json.message ||
                '附件上傳失敗'
              );

            }


            uploadedFileUrl =
              json.fileUrl ||
              '';

            uploadedFileName =
              form.value.file.name;


          } catch (error) {

            console.error(
              '附件上傳失敗：',
              error
            );

            alert(
              '附件上傳至雲端失敗。\n案件仍會儲存，但不會包含附件。'
            );

          } finally {

            isUploadingFile.value =
              false;

          }

        }


        /* ===============================================
           新案件
        ================================================ */

        const newRecord =
          normalizeRecord({

            id:
              'REC_' +
              Date.now() +
              '_' +
              Math.random()
                .toString(36)
                .slice(2, 7),

            category:
              currentCategory.value,

            date:
              form.value.date,

            lightColor:
              form.value.lightColor,

            units:
              [...form.value.units],

            persons:
              [...form.value.persons],

            attendees:
              [...form.value.attendees],

            subject,

            description:
              form.value.description.trim(),

            fileUrl:
              uploadedFileUrl,

            fileName:
              uploadedFileName,

            logs: []

          });


        records.value.unshift(
          newRecord
        );


        /* ===============================================
           清空表單
        ================================================ */

        form.value.subject =
          '';

        form.value.description =
          '';

        form.value.units =
          [];

        form.value.persons =
          [];

        form.value.attendees =
          [];

        form.value.file =
          null;


        if (
          fileInput.value
        ) {

          fileInput.value.value =
            '';

        }


        saveLocalAndCloud();

      };


    /* =====================================================
       輪值
    ====================================================== */

    const promptAddDuty = () => {

      const title =
        prompt(
          '請輸入要輪流的工作名稱：'
        );


      if (
        title &&
        title.trim()
      ) {

        rotationDuties.value.push({

          id:
            'DUTY_' +
            Date.now(),

          title:
            title.trim(),

          members: [],

          newMemberInput: ''

        });


        saveLocalAndCloud();

      }

    };


    const deleteDuty = (
      id
    ) => {

      if (
        !confirm(
          '確定要刪除這項輪流工作嗎？'
        )
      ) {

        return;

      }


      rotationDuties.value =
        rotationDuties.value.filter(
          duty =>
            duty.id !== id
        );


      saveLocalAndCloud();

    };


    const addDutyMember = (
      duty
    ) => {

      const name =
        String(
          duty.newMemberInput || ''
        ).trim();


      if (!name) {

        return;

      }


      if (
        !Array.isArray(
          duty.members
        )
      ) {

        duty.members = [];

      }


      duty.members.push(
        name
      );


      duty.newMemberInput =
        '';


      saveLocalAndCloud();

    };


    const removeDutyMember = (
      duty,
      index
    ) => {

      if (
        !Array.isArray(
          duty.members
        )
      ) {

        return;

      }


      duty.members.splice(
        index,
        1
      );


      saveLocalAndCloud();

    };


    /* =====================================================
       定期評量
    ====================================================== */

    const addExamSchedule = () => {

      examSchedules.value.unshift({

        id:
          'EXAM_' +
          Date.now() +
          '_' +
          Math.random()
            .toString(36)
            .slice(2, 7),

        year: '',

        midChinese: '',

        finalChinese: '',

        midMath: '',

        finalMath: ''

      });


      saveLocalAndCloud();

    };


    const removeExamSchedule = (
      index
    ) => {

      if (
        !confirm(
          '確定要刪除這個學年度的分配表嗎？'
        )
      ) {

        return;

      }


      examSchedules.value.splice(
        index,
        1
      );


      saveLocalAndCloud();

    };


    /* =====================================================
       免 API 行政語氣潤飾
    ====================================================== */

    const localAiRefine = () => {

      const text =
        form.value.description.trim();


      if (!text) {

        alert(
          '請先輸入詳細內容，再進行語氣潤飾。'
        );

        return;

      }


      let refined =
        text;


      /* 常見口語轉行政用語 */
      const replacements = [

        [
          /今天/g,
          '本日'
        ],

        [
          /昨天/g,
          '前一日'
        ],

        [
          /明天/g,
          '翌日'
        ],

        [
          /大家/g,
          '與會人員'
        ],

        [
          /老師們/g,
          '相關教師'
        ],

        [
          /問一下/g,
          '進一步確認'
        ],

        [
          /再看看/g,
          '後續持續研議'
        ],

        [
          /要不要/g,
          '是否'
        ],

        [
          /我覺得/g,
          '經研議'
        ],

        [
          /我們覺得/g,
          '經討論後'
        ],

        [
          /處理/g,
          '辦理'
        ],

        [
          /搞定/g,
          '完成辦理'
        ],

        [
          /有問題/g,
          '相關疑義'
        ],

        [
          /沒有問題/g,
          '無相關疑義'
        ],

        [
          /再討論/g,
          '後續再行研議'
        ]

      ];


      replacements.forEach(
        ([from, to]) => {

          refined =
            refined.replace(
              from,
              to
            );

        }
      );


      /* 自動補行政結尾 */
      if (
        refined &&
        !/[。！？]$/.test(refined)
      ) {

        refined += '。';

      }


      if (
        refined === text
      ) {

        refined =
          `本案說明如下：${text}`;

      }


      form.value.description =
        refined;

    };


    /* =====================================================
       初始化
    ====================================================== */

    onMounted(
      async () => {

        /* 先讀本機，讓畫面立即出現 */
        loadLocalCache();


        /* 再抓雲端 */
        await fetchCloudData();

      }
    );


    /* =====================================================
       ★ 非常重要：return
    ====================================================== */

    return {

      /* View */
      activeView,

      categories,

      currentCategory,

      activeCategory,


      /* Data */
      records,

      tags,

      examSchedules,

      rotationDuties,

      form,


      /* Sync */
      syncStatus,

      syncStatusText,

      lastSyncTime,


      /* File */
      isUploadingFile,

      fileInput,


      /* Computed */
      countByCategory,

      currentCategoryRecords,


      /* Tags */
      addTag,

      editTag,

      removeTag,


      /* Records */
      updateRecord,

      updateRecordLight,

      deleteRecord,

      handleAddLog,

      handleEditLog,

      handleDeleteLog,


      /* Form */
      handleSubmitRecord,

      handleFileSelect,

      clearSelectedFile,

      localAiRefine,


      /* Cloud */
      fetchCloudData,

      saveLocalAndCloud,


      /* Rotation */
      promptAddDuty,

      deleteDuty,

      addDutyMember,

      removeDutyMember,


      /* Exam */
      addExamSchedule,

      removeExamSchedule

    };

  }

}).mount('#app');

</script>

</body>
</html>
