<!-- 一、重要公文 -->
        <section v-if="currentTab === 'official_doc'" class="space-y-6">
          <!-- 新增表單 -->
          <div class="bg-white rounded-xl shadow-sm p-6 border">
            <h2 class="text-lg font-bold mb-4 text-slate-700 border-b pb-2">➕ 新增重要公文紀錄</h2>
            <form @submit.prevent="submitOfficialDoc" class="space-y-4">
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">公文發出日期</label>
                  <input type="date" v-model="docForm.date" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500" required>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">張貼公文文號</label>
                  <input type="text" v-model="docForm.docNo" placeholder="例如：投教字第11200000號" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500">
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">公文主旨</label>
                <input type="text" v-model="docForm.subject" placeholder="請輸入公文主旨" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500" required>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">公文說明</label>
                <textarea rows="3" v-model="docForm.description" placeholder="請輸入說明內容..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500"></textarea>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">公文雲端硬碟連結</label>
                <input type="url" v-model="docForm.driveUrl" placeholder="https://drive.google.com/..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500">
              </div>
              <button type="submit" class="bg-sky-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-sky-700 transition-colors">
                儲存公文紀錄
              </button>
            </form>
          </div>

          <!-- 已存檔公文列表 -->
          <div class="bg-white rounded-xl shadow-sm p-6 border space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
              <h2 class="text-lg font-bold text-slate-700">📂 已存檔的重要公文列表</h2>
              <button @click="fetchCloudData" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded transition-colors font-medium">
                🔄 重新整理列表
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full border-collapse border border-slate-200 text-sm">
                <thead>
                  <tr class="bg-slate-100 text-slate-700 text-center">
                    <th class="border border-slate-200 p-2.5">學年度</th>
                    <th class="border border-slate-200 p-2.5">發出日期</th>
                    <th class="border border-slate-200 p-2.5">文號</th>
                    <th class="border border-slate-200 p-2.5">主旨</th>
                    <th class="border border-slate-200 p-2.5">承辦人</th>
                    <th class="border border-slate-200 p-2.5">連結</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="(row, idx) in officialDocsList" :key="idx" class="hover:bg-slate-50 text-center">
                    <td class="border border-slate-200 p-2.5 font-medium text-slate-600">{{ row[1] }}</td>
                    <td class="border border-slate-200 p-2.5 text-slate-600">{{ row[4] }}</td>
                    <td class="border border-slate-200 p-2.5 text-slate-600">{{ row[5] }}</td>
                    <td class="border border-slate-200 p-2.5 text-left font-bold text-sky-700">{{ row[6] }}</td>
                    <td class="border border-slate-200 p-2.5 text-slate-600">{{ row[3] }}</td>
                    <td class="border border-slate-200 p-2.5">
                      <a v-if="row[8]" :href="row[8]" target="_blank" class="text-sky-600 hover:underline font-bold text-xs">開啟連結</a>
                      <span v-else class="text-gray-300 text-xs">無</span>
                    </td>
                  </tr>
                  <tr v-if="officialDocsList.length === 0">
                    <td colspan="6" class="border border-slate-200 p-8 text-center text-gray-400">
                      目前尚無公文資料，或正在載入中...請點擊右上角重新整理。
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
