<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政工作系統紀錄規劃</title>
  <!-- 引入 Tailwind CSS 樣式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <div id="app" class="flex h-screen overflow-hidden">
    
    <!-- 左側選單 Sidebar -->
    <aside class="w-64 bg-slate-800 text-white flex flex-col justify-between">
      <div>
        <div class="p-5 text-xl font-bold tracking-wider border-b border-slate-700">
          🏫 行政工作紀錄系統
        </div>
        <nav class="mt-4 space-y-1">
          <button v-for="tab in tabs" :key="tab.id"
                  @click="currentTab = tab.id"
                  :class="['w-full text-left px-5 py-3 text-sm font-medium transition-colors', 
                           currentTab === tab.id ? 'bg-sky-600 text-white' : 'text-slate-300 hover:bg-slate-700 hover:text-white']">
            {{ tab.name }}
          </button>
        </nav>
      </div>
      <div class="p-4 text-xs text-slate-400 border-t border-slate-700 text-center">
        文華國小 5年級行政系統
      </div>
    </aside>

    <!-- 右側主要內容區 Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
      
      <!-- 上方頂部列 (包含可自由編輯的標籤) -->
      <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center border-b">
        <h1 class="text-xl font-bold text-slate-700">
          {{ tabs.find(t => t.id === currentTab).name }}
        </h1>
        
        <!-- 自由編輯標籤區 -->
        <div class="flex items-center space-x-4 bg-slate-50 p-2 rounded-lg border">
          <div class="flex items-center space-x-2">
            <label class="text-xs font-semibold text-slate-500">承辦單位:</label>
            <input type="text" v-model="globalSettings.department" 
                   class="px-2 py-1 text-sm border rounded bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 w-28">
          </div>
          <div class="flex items-center space-x-2">
            <label class="text-xs font-semibold text-slate-500">承辦人員:</label>
            <input type="text" v-model="globalSettings.assignee" 
                   class="px-2 py-1 text-sm border rounded bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 w-24">
          </div>
        </div>
      </header>

      <!-- 內容動態切換區 -->
      <div class="p-8 max-w-5xl w-full mx-auto">
        
        <!-- 一、重要公文 -->
        <section v-if="currentTab === 'official_doc'" class="bg-white rounded-xl shadow-sm p-6 border">
          <h2 class="text-lg font-bold mb-4 text-slate-700 border-b pb-2">➕ 新增重要公文紀錄</h2>
          <form @submit.prevent="submitOfficialDoc" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">公文發出日期</label>
                <input type="date" v-model="docForm.date" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">張貼公文文號</label>
                <input type="text" v-model="docForm.docNo" placeholder="例如：投教字第11200000號" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">公文主旨</label>
              <input type="text" v-model="docForm.subject" placeholder="請輸入公文主旨" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">公文說明</label>
              <textarea rows="3" v-model="docForm.description" placeholder="請輸入說明內容..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">公文雲端硬碟連結</label>
              <input type="url" v-model="docForm.driveUrl" placeholder="https://drive.google.com/..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>
            <button type="submit" class="bg-sky-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-sky-700 transition-colors">
              儲存公文紀錄
            </button>
          </form>
        </section>

        <!-- 二、學年會議 -->
        <section v-if="currentTab === 'grade_meeting'" class="bg-white rounded-xl shadow-sm p-6 border">
          <h2 class="text-lg font-bold mb-4 text-slate-700 border-b pb-2">➕ 新增學年會議提案</h2>
          <form @submit.prevent="submitMeeting" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">會議日期</label>
                <input type="date" v-model="meetingForm.date" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">提案狀態 (紅黃綠燈)</label>
                <div class="flex space-x-3 pt-1">
                  <button type="button" @click="meetingForm.status = 'red'" 
                          :class="['px-3 py-1 rounded text-xs font-bold transition-all', meetingForm.status === 'red' ? 'bg-red-500 text-white ring-2 ring-red-300' : 'bg-red-100 text-red-600']">
                    🔴 未處理/卡關
                  </button>
                  <button type="button" @click="meetingForm.status = 'yellow'" 
                          :class="['px-3 py-1 rounded text-xs font-bold transition-all', meetingForm.status === 'yellow' ? 'bg-amber-500 text-white ring-2 ring-amber-300' : 'bg-amber-100 text-amber-600']">
                    🟡 處理中
                  </button>
                  <button type="button" @click="meetingForm.status = 'green'" 
                          :class="['px-3 py-1 rounded text-xs font-bold transition-all', meetingForm.status === 'green' ? 'bg-emerald-500 text-white ring-2 ring-emerald-300' : 'bg-emerald-100 text-emerald-600']">
                    🟢 已解決/結案
                  </button>
                </div>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">學年提案主旨</label>
              <input type="text" v-model="meetingForm.subject" placeholder="請輸入提案主旨" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">提案說明</label>
              <textarea rows="3" v-model="meetingForm.description" placeholder="請詳細說明提案內容..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">學校行政端回覆</label>
              <textarea rows="2" v-model="meetingForm.reply" placeholder="行政端回覆內容..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">雲端硬碟連結</label>
              <input type="url" v-model="meetingForm.driveUrl" placeholder="https://drive.google.com/..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500">
            </div>
            <button type="submit" class="bg-sky-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-sky-700 transition-colors">
              儲存會議紀錄
            </button>
          </form>
        </section>

        <!-- 三~七 待討論分頁 -->
        <section v-else class="bg-white rounded-xl shadow-sm p-12 text-center border">
          <div class="text-4xl mb-3">🚧</div>
          <h2 class="text-xl font-bold text-slate-700 mb-2">{{ tabs.find(t => t.id === currentTab).name }}</h2>
          <p class="text-gray-500 text-sm">此功能模組正在規劃中，稍後我們將一起討論並建置此區塊！</p>
        </section>

      </div>
    </main>

  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        // 側邊選單列表
        const tabs = ref([
          { id: 'official_doc', name: '一、重要公文' },
          { id: 'grade_meeting', name: '二、學年會議' },
          { id: 'exam_record', name: '三、學年出題記錄' },
          { id: 'duty_roster', name: '四、學年工作輪流紀錄' },
          { id: 'graduation_trip', name: '五、畢業旅行' },
          { id: 'graduation_album', name: '六、畢業紀念冊' },
          { id: 'graduation_ceremony', name: '七、畢業典禮' }
        ]);

        // 當前選中的分頁
        const currentTab = ref('official_doc');

        // 上方可自由編輯的全域標籤狀態
        const globalSettings = ref({
          department: '教務處',
          assignee: '王老師'
        });

        // 公文表單資料
        const docForm = ref({
          date: '',
          docNo: '',
          subject: '',
          description: '',
          driveUrl: ''
        });

        // 會議表單資料
        const meetingForm = ref({
          date: '',
          subject: '',
          description: '',
          reply: '',
          driveUrl: '',
          status: 'yellow' // 預設黃燈
        });

        // 提交公文
        const submitOfficialDoc = () => {
          console.log("送出公文：", {
            ...globalSettings.value,
            ...docForm.value
          });
          alert("【模擬】重要公文資料已暫存！稍後我們將把這裡接上 GAS 傳送後端。");
        };

        // 提交會議
        const submitMeeting = () => {
          console.log("送出會議：", {
            ...globalSettings.value,
            ...meetingForm.value
          });
          alert("【模擬】學年會議資料已暫存！稍後我們將把這裡接上 GAS 傳送後端。");
        };

        return {
          tabs,
          currentTab,
          globalSettings,
          docForm,
          meetingForm,
          submitOfficialDoc,
          submitMeeting
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
