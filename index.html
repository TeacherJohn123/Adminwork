<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政追蹤檢核系統</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
  <div id="app" class="max-w-7xl mx-auto space-y-6">
    
    <header class="bg-white rounded-xl shadow-sm p-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-slate-800">🏫 行政工作追蹤檢核系統</h1>
      <button @click="loadRecords" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-sm transition">🔄 重新整理資料</button>
    </header>

    <section class="bg-white rounded-xl shadow-sm p-6">
      <h2 class="text-lg font-bold text-slate-700 mb-4">📝 新增案件</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">日期</label>
          <input v-model="form.date" type="date" class="w-full border border-slate-300 p-2 rounded-lg text-sm bg-white">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">燈號進度</label>
          <select v-model="form.light" class="w-full border border-slate-300 p-2 rounded-lg text-sm">
            <option value="green">🟢 綠燈 (順利/已辦理)</option>
            <option value="yellow">🟡 黃燈 (討論中/注意)</option>
            <option value="red">🔴 紅燈 (卡關/否決)</option>
          </select>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-700 mb-1">事件主旨</label>
        <input v-model="form.subject" type="text" placeholder="簡述主旨..." class="w-full border border-slate-300 p-3 rounded-lg text-sm mb-4">
        
        <label class="flex justify-between items-end text-xs font-bold text-slate-700 mb-1">
          <span>詳細內容說明與草稿</span>
        </label>
        <textarea v-model="form.description" placeholder="在此輸入詳細說明或草稿..." class="w-full border border-slate-300 p-3 rounded-lg text-sm h-32 focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <button @click="saveRecord" class="bg-slate-800 text-white px-6 py-2 rounded-lg shadow hover:bg-slate-700 transition font-bold">💾 儲存案件</button>
    </section>

    <!-- 燈號分類呈現區 -->
    <div class="space-y-8 mt-8">
      <section>
        <h3 class="text-xl font-bold text-yellow-600 mb-4 border-b-2 border-yellow-200 pb-2">🟡 黃燈案件 (辦理中)</h3>
        <div class="grid gap-4"><record-card v-for="r in sortedRecords('yellow')" :key="r.id" :record="r"></record-card></div>
      </section>
      <section>
        <h3 class="text-xl font-bold text-emerald-600 mb-4 border-b-2 border-emerald-200 pb-2">🟢 綠燈案件 (已完成)</h3>
        <div class="grid gap-4"><record-card v-for="r in sortedRecords('green')" :key="r.id" :record="r"></record-card></div>
      </section>
      <section>
        <h3 class="text-xl font-bold text-red-600 mb-4 border-b-2 border-red-200 pb-2">🔴 紅燈案件 (待核定)</h3>
        <div class="grid gap-4"><record-card v-for="r in sortedRecords('red')" :key="r.id" :record="r"></record-card></div>
      </section>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    const RecordCard = {
      props: ['record'],
      template: `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-2 transition hover:shadow-md">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-medium bg-slate-100 text-slate-600 px-2 py-1 rounded">{{ record.date.substring(0,10) }}</span>
          </div>
          <p class="font-bold text-slate-800 text-lg">{{ record.subject }}</p>
          <!-- 正確顯示詳細內容說明 -->
          <div v-if="record.description" class="mt-2 p-3 bg-slate-50 text-sm text-slate-600 rounded-lg border border-slate-100 whitespace-pre-wrap"><strong>📋 說明：</strong>\n{{ record.description }}</div>
        </div>
      `
    };

    createApp({
      components: { RecordCard },
      setup() {
        // !!! 部署後請將這裡的網址替換為您的 /exec 網址 !!!
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzHcdzs99w57PK-H2_YnRBoxeTJUhhCS5z7LcBCMuWbDOvjpdp2EGZBfrsJQ3Z2oOye/exec';

        const form = ref({ 
          date: new Date().toISOString().split('T')[0], 
          format: [], meetingName: [], organizer: [], status: [], 
          light: 'yellow', subject: '', description: '', fileUrl: '', summary: '' 
        });
        
        const records = ref([]);

        const loadRecords = async () => {
          try {
            const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getRecords' }) });
            const json = await res.json();
            if(json.data) records.value = json.data;
          } catch(e) { console.error('讀取失敗', e); }
        };

        const saveRecord = async () => {
          if(!form.value.subject) return alert('請填寫主旨！');
          
          const newRecord = {
            id: 'R_' + new Date().getTime(),
            date: form.value.date,
            light: form.value.light,
            subject: form.value.subject,
            description: form.value.description, // 確保前端打包到 description
            fileUrl: form.value.fileUrl,
            summary: form.value.summary
          };
          records.value.unshift(newRecord); 

          try {
            const payload = {
              action: 'saveRecord',
              ...newRecord
            };
            
            await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
            
            form.value.subject = ''; form.value.description = ''; 
          } catch(e) { 
            alert('存檔過程發生異常'); 
          }
        };

        const sortedRecords = (lightColor) => {
          return records.value
            .filter(r => r.light === lightColor)
            .sort((a, b) => new Date(b.date) - new Date(a.date));
        };

        onMounted(loadRecords);

        return { form, records, loadRecords, saveRecord, sortedRecords };
      }
    }).mount('#app');
  </script>
</body>
</html>
